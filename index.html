<script id="animo-device-typography-bootstrap">
(function(){
  const KEY='animo_match_control_device_typography_v1';
  const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
  let cfg={scale:1,weightShift:0};
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||'null');
    if(raw&&typeof raw==='object'){
      cfg.scale=clamp(Number(raw.scale)||1,.85,1.25);
      cfg.weightShift=clamp(Number(raw.weightShift)||0,-100,100);
    }
  }catch(_e){}
  document.documentElement.style.setProperty('--animo-device-font-scale',String(cfg.scale));
  document.documentElement.style.setProperty('--animo-device-font-weight-shift',String(cfg.weightShift));
  window.__animoDeviceTypographyBootstrap={key:KEY,config:cfg};
})();
</script>

function timeToMinutes(t){

     if(m.teamA===seed.code){row.pe+=m.scoreA;row.pc+=m.scoreB}else{row.pe+=m.scoreB;row.pc+=m.scoreA}
    }else if(m.status==='Forfeit'&&state.settings?.forfeitPQPolicy==='target_zero'){

    }

 if(divisionPrelimsComplete(div)){

}

 };

 }

 }
 if(q.winnerSeedTie?.length){

function qualificationSummary(div){
 const q=qualificationForDivision(div),done=divisionPrelimMatches(div).filter(m=>['Completed','Forfeit'].includes(m.status)).length,total=divisionPrelimMatches(div).length;
 const pct=total?Math.round(done/total*100):0,qualifiers=q.winnerSeeds?.length===4?q.winnerSeeds:(q.qualifiers||[]),pairings=q.pairings||[];
 const labels=qualifiers.length===4?['Seed #1','Seed #2','Seed #3','Seed #4']:qualifiers.map((_,i)=>`Qualifier ${i+1}`);
 const eq=q.equalization||{},counts=q.brackets.map(br=>Number(eq.poolTeamCounts?.[br])||0),balanced=counts.length?new Set(counts).size===1:true;
 const distribution=counts.length?counts.join('–'):'—',normalized=q.brackets.map(()=>Number(eq.commonTeamCount)||0).join('–');
 const excluded=Object.entries(eq.excludedByBracket||{}).flatMap(([br,rows])=>(rows||[]).map(r=>`Bracket ${br}: ${r.code}`));
 const equalizationNote=balanced
  ? `<div class="progress-note"><b>Division leaderboard:</b> all brackets are already balanced at ${esc(distribution)}. All eligible preliminary results count.</div>`
  : `<div class="progress-note"><b>Equalized comparison:</b> ${esc(distribution)} → ${esc(normalized)}. Excluded from qualification calculations: ${esc(excluded.join(' · ')||'TBD until final bracket standings')}.</div>`;
 const unresolved=q.unresolvedStandings?.length||q.winnerSeedTie?.length;
 return `<div class="qualification-summary"><div class="qualification-head"><div><b>Semifinal qualification</b><span>Single ${esc(div)} leaderboard · ${done}/${total} preliminary matches final</span></div><span class="status ${q.ready&&!unresolved?'completed':''}">${q.ready&&!unresolved?'Ready':q.ready?'Decision required':`${pct}% complete`}</span></div><div class="qualifier-grid">${qualifiers.map((r,i)=>qualifierItem(r,labels[i])).join('')}</div>${equalizationNote}${pairings.length===2?`<div class="callout"><b>Semifinal pairings</b><p>${esc(pairings[0].label)} · ${esc(pairings[1].label)}</p></div>`:''}${unresolved?`<div class="progress-note"><b>Tournament Director review required.</b> Qualification remains exactly tied after the published ranking hierarchy or the equalization cut line is unresolved.</div>`:''}<div class="progress-note"><b>Qualification rule:</b> one combined division/category leaderboard → Win Rate → highest Points Earned → lowest Points Conceded → Top 4. Semifinals are #1 vs #4 and #2 vs #3. Uneven brackets are normalized to the smallest bracket size before comparison.</div></div>`
}

function ppxResolvedMatch(m){

function ppxMatchLoser(m){

function ppxBracketChangeAudit(team,nextBracket){
 const from=String(team.bracket||'').toUpperCase(),to=String(nextBracket||'').toUpperCase();
 const linked=allMatches().filter(m=>m.teamA===team.code||m.teamB===team.code);
 const incompatible=linked.filter(m=>m.kind==='prelim'&& (m.division!==team.division||m.bracket!==to));
 const progressed=state.playoffs.filter(m=>m.division===team.division&&(m.status!=='Scheduled'||m.actualStartAt||m.actualEndAt||m.resultRecordedAt||m.resultConfirmedAt||m.scoreA!=null||m.scoreB!=null));
 const invalidPlayoffs=linked.filter(m=>m.kind!=='prelim'&&(m.status!=='Scheduled'||m.actualStartAt||m.actualEndAt||m.resultRecordedAt||m.resultConfirmedAt));
 return {from,to,linked,incompatible,progressed,invalidPlayoffs,changed:from!==to,
  permissible:incompatible.length===0&&progressed.length===0&&invalidPlayoffs.length===0};
}

function replaceCodeDeep(obj,oldCode,newCode){if(obj===oldCode)return newCode;if(Array.isArray(obj)){for(let i=0;i<obj.length;i++)obj[i]=replaceCodeDeep(obj[i],oldCode,newCode);return obj}if(obj&&typeof obj==='object'){for(const k of Object.keys(obj))obj[k]=replaceCodeDeep(obj[k],oldCode,newCode)}return obj}

function saveRosterTeam(oldCode=''){

   if(bracketChanged){
     // Old qualifier snapshots and bracket-specific tie resolutions are stale after moving a roster entry.

     if(state.settings.qualificationSnapshots)delete state.settings.qualificationSnapshots[division];
     if(state.settings.medalSnapshots)delete state.settings.medalSnapshots[division];
     if(state.settings.standingTieOverrides){for(const key of Object.keys(state.settings.standingTieOverrides))if(key.startsWith(`${division}::${previousBracket}::`)||key.startsWith(`${division}::${bracket}::`))delete state.settings.standingTieOverrides[key];}

   }
   rebuildTeamMap();state.roster=deepClone(BASE_DATA.teams);
   const saved=saveState(bracketChanged?`Roster bracket corrected: ${code} · ${division} · ${previousBracket} → ${bracket} · ${teamMatchCount(code)} linked fixtures checked · ${p1} / ${p2}`:`Roster updated: ${code} · ${p1} / ${p2}`);
   if(!saved){state=beforeSave;syncRosterIntoBase(beforeTeams);for(const key of Object.keys(BASE_DATA.hospitals))delete BASE_DATA.hospitals[key];Object.assign(BASE_DATA.hospitals,beforeHospitals);renderAll();toast('Roster change was not saved. Original bracket restored.');return;}

function rosterAssignments(code){return allMatches().filter(m=>m.teamA===code||m.teamB===code)}
function rosterAssignmentProtected(m){return m.status!=='Scheduled'||Boolean(m.actualStartAt||m.actualEndAt||m.resultRecordedAt)}
function openDeleteProtection(code){
 const t=teamMap[code];if(!t)return;

 title.innerHTML=`<div class="modal-title-stack"><h2>${assignments.length?'Assignment Protection':'Delete Team'}</h2><div class="modal-subtitle">${esc(code)} · ${esc((t.players||[]).join(' / '))}</div></div>`;

 document.getElementById('modalBody').innerHTML=`<div class="delete-protection">
   ${assignments.length?`<div class="delete-protection-alert"><span class="delete-protection-icon">!</span><div><b>${assignments.length} match assignment${assignments.length===1?'':'s'} currently reference ${esc(code)}</b><p>The team cannot be deleted while match records still point to it. Review the assignments below before removing the roster entry.</p></div></div>`:`<div class="delete-protection-ready"><b>No match assignments remain.</b><p>${esc(code)} can now be deleted without leaving broken schedule or standings references.</p></div>`}
   ${assignments.length?`<div class="delete-assignment-list">${rows}</div>`:''}
   ${protectedMatches.length?`<div class="delete-protected-note"><b>${protectedMatches.length} protected match${protectedMatches.length===1?'':'es'} cannot be detached.</b><p>Live, held or resolved matches preserve tournament history. Reset/correct those match records first if removal is genuinely required.</p></div>`:''}

 </div>`;
 document.getElementById('modalBackdrop').classList.add('open');
}
function detachRosterAssignments(code){
 const t=teamMap[code];if(!t)return;const assignments=rosterAssignments(code);if(!assignments.length){openDeleteProtection(code);return}
 const protectedMatches=assignments.filter(rosterAssignmentProtected);if(protectedMatches.length){toast('One or more assignments are active or resolved and cannot be detached.');openDeleteProtection(code);return}
 if(!confirm(`Remove ${code} from ${assignments.length} scheduled match assignment${assignments.length===1?'':'s'}? The match records will be retained as Unscheduled with this team slot cleared.`))return;
 const audit={code,players:deepClone(t.players||[]),hospital:t.hospital,division:t.division,bracket:t.bracket,detachedAt:new Date().toISOString()};
 for(const m of assignments){m.removedFromSchedule=true;m.scheduleModified=true;m.rosterDetachAudit=deepClone(audit);if(m.teamA===code)m.teamA='';if(m.teamB===code)m.teamB='';m.scoreA=null;m.scoreB=null;m.winner=null;m.notes=(m.notes?m.notes+' · ':'')+`${code} detached from schedule for roster removal`;}
 saveState(`${code} detached from ${assignments.length} unstarted schedule assignment${assignments.length===1?'':'s'}; match records retained as Unscheduled`);openDeleteProtection(code);toast('Schedule assignments cleared. Review and confirm Delete Team.');
}
function confirmRosterDeletion(code){

/* v5.07 — Verified-qualification auto seeding; never overwrites live/finished brackets.

function ppxAutoSeedConfirmedSemifinals(){
 const result={assigned:0,protected:[],waiting:[],unresolved:[]};
 if(startupRecovery?.active||!state||!Array.isArray(state.matches)||!Array.isArray(state.playoffs))return result;

 state.settings.qualificationSnapshots=state.settings.qualificationSnapshots||{};
 for(const div of [...new Set(BASE_DATA.teams.map(t=>t.division))]){
  // Completed alone is not official. Every scheduled RR pairing needs an audited result.
  if(!officialPrelimsConfirmed(div)){result.waiting.push(div);continue}
  const q=qualificationForDivision(div);
  if(!q.ready||q.qualifiers?.length!==4||q.pairings?.length!==2||q.unresolvedStandings?.length||q.winnerSeedTie?.length||q.pairingTie?.length){result.unresolved.push(div);continue}
  const slots=['Semifinal 1','Semifinal 2'].map(stage=>state.playoffs.find(m=>m.division===div&&m.stage===stage));
  if(slots.some(m=>!m)){result.unresolved.push(div);continue}
  const pairings=q.pairings;
  const entrants=pairings.flatMap(p=>[p.a,p.b]);
  if(entrants.length!==4||entrants.some(code=>!code||!teamMap[code]||teamDisqualified(code))||new Set(entrants).size!==4){result.unresolved.push(div);continue}
  const same=(m,p)=>(m.teamA===p.a&&m.teamB===p.b)||(m.teamA===p.b&&m.teamB===p.a);

  // from newly calculated qualification (requires Tournament Director review).
  if(slots.some((m,i)=>playoffSeedLocked(m)&&!same(m,pairings[i]))){result.protected.push(div);continue}
  let valid=true;
  for(let i=0;i<2;i++){
   if(same(slots[i],pairings[i]))continue;
   if(playoffSeedLocked(slots[i])||!seedPlayoffPair(slots[i],pairings[i].a,pairings[i].b)){valid=false;break}
   result.assigned++;
  }
  if(!valid){result.protected.push(div);continue}
  // This snapshot is the dependency guard used by subsequent playoff progression.
  if(slots.every((m,i)=>same(m,pairings[i])))state.settings.qualificationSnapshots[div]=prelimSignature(div);
 }
 return result;
}


function applyQualificationLogic(){
 let seeded=0,threeBracketSeeded=0,fourBracketSeeded=0,waiting=0,unresolved=0,protectedSlots=0,confirmationBlocked=0;
 for(const div of [...new Set(BASE_DATA.teams.map(t=>t.division))]){
  const q=qualificationForDivision(div);
  if(!q.ready){waiting++;continue}
  const pendingConfirm=unconfirmedDivisionPrelims(div);
  if(pendingConfirm.length){confirmationBlocked+=pendingConfirm.length;continue}
  if(q.unresolvedStandings?.length||q.winnerSeedTie?.length||q.pairingTie?.length){unresolved++;continue}
  const s1=state.playoffs.find(p=>p.division===div&&p.stage==='Semifinal 1'),
        s2=state.playoffs.find(p=>p.division===div&&p.stage==='Semifinal 2');
  if(q.brackets.length===2){
   const p1=q.pairings[0],p2=q.pairings[1];
   if(s1&&p1?.a&&p1?.b){seedPlayoffPair(s1,p1.a,p1.b)?seeded++:protectedSlots++}
   if(s2&&p2?.a&&p2?.b){seedPlayoffPair(s2,p2.a,p2.b)?seeded++:protectedSlots++}
  }else if(q.brackets.length===3){
   if(!q.wildcard||q.pairings.length!==2){unresolved++;continue}
   const p1=q.pairings[0],p2=q.pairings[1];
   if(s1&&p1?.a&&p1?.b){if(seedPlayoffPair(s1,p1.a,p1.b)){threeBracketSeeded++;seeded++}else protectedSlots++}
   if(s2&&p2?.a&&p2?.b){if(seedPlayoffPair(s2,p2.a,p2.b)){threeBracketSeeded++;seeded++}else protectedSlots++}
  }else if(q.brackets.length===4){
   if(q.qualifiers.length!==4||q.pairings.length!==2){unresolved++;continue}
   const p1=q.pairings[0],p2=q.pairings[1];
   if(s1&&p1?.a&&p1?.b){if(seedPlayoffPair(s1,p1.a,p1.b)){fourBracketSeeded++;seeded++}else protectedSlots++}
   if(s2&&p2?.a&&p2?.b){if(seedPlayoffPair(s2,p2.a,p2.b)){fourBracketSeeded++;seeded++}else protectedSlots++}
  }
 }
 saveState(`Qualification logic applied: ${seeded} semifinal slots seeded${confirmationBlocked?`; ${confirmationBlocked} preliminary result(s) awaiting confirmation`:''}${unresolved?`; ${unresolved} qualification decision(s) unresolved`:''}${protectedSlots?`; ${protectedSlots} started/resolved slot(s) protected`:''}${waiting?`; ${waiting} division(s) still in prelims`:''}`);
 toast(confirmationBlocked?'Official qualification is blocked until all completed preliminary results are confirmed.':protectedSlots?'Qualification updated without overwriting started/resolved semifinal records.':unresolved?'Resolve the outstanding Tournament Director decision(s) before automatic semifinal seeding.':'Qualification logic applied and semifinal pairings updated.')
}
function advanceMedalMatches(){let n=0,protectedSlots=0;for(const div of [...new Set(state.playoffs.map(p=>p.division))]){const semis=state.playoffs.filter(p=>p.division===div&&p.stage.startsWith('Semifinal')&&['Completed','Forfeit'].includes(p.status));if(semis.length<2)continue;const winners=semis.map(matchWinner),losers=semis.map(m=>matchWinner(m)===m.teamA?m.teamB:m.teamA);const gold=state.playoffs.find(p=>p.division===div&&p.stage==='Gold Match'),bronze=state.playoffs.find(p=>p.division===div&&p.stage==='Bronze Match');if(gold){seedPlayoffPair(gold,winners[0],winners[1])?n++:protectedSlots++}if(bronze){seedPlayoffPair(bronze,losers[0],losers[1])?n++:protectedSlots++}}saveState(`Applied completed semifinal results to ${n} medal-match slots${protectedSlots?`; ${protectedSlots} started/resolved slot(s) protected`:''}`);toast(protectedSlots?'Medal participants updated without overwriting started/resolved matches.':'Medal matches updated from semifinal results.')}

          <div class="card v3-progress"><div class="panel-title"><div><div class="eyebrow">EVENT PROGRESSION</div><h3>${summary.done} of ${allMatches().length} matches resolved</h3></div><strong>${completePct}%</strong></div><div class="v3-progress-bar"><i style="width:${completePct}%"></i></div><div class="v3-progress-copy"><span>${checked}/${total} teams checked in</span><span>${allMatches().length-summary.done} matches remaining</span></div></div>
          <div class="card v3-attention"><div class="panel-title"><div><div class="eyebrow">ATTENTION</div><h3>Exceptions</h3></div><small>${blocked.length+unchecked.length} immediate</small></div><div class="exception-list">
            ${blocked.slice(0,4).map(({m,a})=>`<button class="exception-row" onclick="openMatch('${m.id}')"><span class="exception-mark ${a.state}"></span><div><b>${esc(m.id)} · Court ${m.court}</b><small>${esc(a.details?.[0]||a.label)}</small></div></button>`).join('')}
            ${unchecked.length?`<button class="exception-row" onclick="setSection('teams')"><span class="exception-mark checkin"></span><div><b>${unchecked.length} upcoming team${unchecked.length===1?'':'s'} not checked in</b><small>${esc(unchecked.slice(0,5).join(', '))}${unchecked.length>5?'…':''}</small></div></button>`:''}
            ${!blocked.length&&!unchecked.length?'<div class="empty compact">No immediate blockers.</div>':''}</div></div>
        </div>
      </div>`;
  };


  courtCard = function(c){
    const m=currentForCourt(c);
    if(!m) return `<div class="card court-card open"><div class="court-head"><div class="court-title"><span>COURT</span><b>${c}</b></div><span class="court-state">OPEN</span></div><div class="court-match"><div class="court-block"><b>No active assignment</b><span>The court is available for tournament operations.</span></div></div><div class="court-actions"><button class="btn tiny" onclick="setSection('schedule')">View schedule</button></div></div>`;
    const avail=m.status==='Scheduled'?matchAvailability(m):null;
    const cls=m.status==='Live'?'live':m.status==='Hold'?'hold':m.status==='Result Pending'?'pending':avail?.state||'queued';
    const label=m.status==='Scheduled'?(avail?.label||'QUEUED'):m.status.toUpperCase();
    let context='';
    if(m.status==='Live') context=`<div class="court-block live-time"><b class="live-elapsed-clock" data-elapsed-start="${esc(m.actualStartAt||'')}" data-elapsed-end="">${esc(elapsedText(m.actualStartAt,null))}</b><span>Started ${esc(fmtTime(m.actualStartAt))}</span></div>`;
    else if(m.status==='Hold') context=`<div class="court-block"><b>Match on hold</b><span>Keep this court pinned until the issue is resolved.</span></div>`;
    else if(m.status==='Result Pending') context=`<div class="court-block"><b>Result pending</b><span>Finalize the score before releasing Court ${c}.</span></div>`;
    else if(avail) context=`<div class="queue-state">${availabilityHtml(m)}</div>${avail.state!=='ready'?`<div class="court-block"><span>${avail.details.map(esc).join('<br>')}</span></div>`:''}`;
    const primary=m.status==='Scheduled'&&avail?.state==='ready'?`<button class="btn tiny primary" onclick="quickStart('${m.id}')">Start Match</button>`:`<button class="btn tiny ${['Hold','Result Pending'].includes(m.status)?'primary':''}" onclick="openMatch('${m.id}')">${m.status==='Live'?'Score / End':['Hold','Result Pending'].includes(m.status)?'Resolve':'Review'}</button>`;
    return `<div class="card court-card ${cls}"><div class="court-head"><div class="court-title"><span>COURT</span><b>${c}</b></div><span class="court-state ${statusClass(label)}">${esc(label)}</span></div><div class="court-context"><b>${esc(m.id)} · ${esc(m.time)}</b><span>${esc(m.division)} · ${esc(m.stage)}</span></div><div class="court-match"><div class="teamline"><div>${teamDisplayInline(m.teamA)}</div><span class="score">${m.scoreA??'—'}</span></div><div class="teamline"><div>${teamDisplayInline(m.teamB)}</div><span class="score">${m.scoreB??'—'}</span></div>${context}</div><div class="court-actions"><button class="btn tiny" onclick="openMatch('${m.id}')">Details</button>${primary}</div></div>`;
  };


  matchControl = function(){
    return `<div class="section-head"><div><div class="eyebrow">FLOOR CONTROL</div><h1>Match Control</h1><p>Each card represents a physical court. The system prioritizes the action the tournament desk should take next.</p></div><div class="head-actions"><button class="btn" onclick="togglePlayersPanel()">${state.settings.playersPanel?'Hide':'Show'} Player Watch</button></div></div>${statusRail()}<div class="court-layout ${state.settings.playersPanel?'':'sidebar-off'}"><div class="courts-grid">${EVENT_COURTS.map(c=>courtCard(c)).join('')}</div>${state.settings.playersPanel?playersPanel():''}</div>${queueHtml()}`;
  };


  // Schedule renderer authority is delegated to v4-18 Smart Schedule.


  // Keep the live time visible without forcing a full re-render every second.
  setInterval(()=>{
    document.querySelectorAll('.v3-live-clock').forEach(el=>{el.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
    updateElapsedClocks();
  },1000);
  updateElapsedClocks();


  // Render after the final renderer overrides are installed.
  renderAll();
  setInterval(()=>{if(document.visibilityState==='visible')refreshActiveSection()},60000);
})();
</script>




<script id="v4-6-score-entry-guard">
(() => {
  const isScore = el => el instanceof HTMLInputElement && el.classList.contains('score-input');
  const clean = el => {
    const value = String(el.value || '').replace(/\D+/g,'').slice(0,3);
    if (el.value !== value) el.value = value;
  };
  document.addEventListener('input', e => { if (isScore(e.target)) clean(e.target); }, true);
  document.addEventListener('paste', e => {
    if (!isScore(e.target)) return;
    const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    if (/^\d{0,3}$/.test(txt.trim())) return;
    e.preventDefault();
    const digits = txt.replace(/\D+/g,'').slice(0,3);
    e.target.value = digits;
    e.target.dispatchEvent(new Event('input',{bubbles:true}));
  }, true);
  document.addEventListener('wheel', e => {
    if (isScore(e.target)) e.preventDefault();
  }, {passive:false,capture:true});
  document.addEventListener('keydown', e => {
    if (!isScore(e.target)) return;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  }, true);
})();
</script>

<script id="v4-18-smart-schedule">
(() => {
  let dragMatchId = null;
  let dragRecently = false;
  let pendingMovePlan = null;
  let smartFocusCourt = 0;
  window.setScheduleFocus = function(v){smartFocusCourt=Number(v)||0;renderScheduleOnly()};


  const inferSlotMinutes = () => {
    const vals=[...new Set(scheduledMatches().filter(m=>m.time).map(m=>timeToMinutes(m.time)).filter(Number.isFinite))].sort((a,b)=>a-b);
    const diffs=[];for(let i=1;i<vals.length;i++){const d=vals[i]-vals[i-1];if(d>0&&d<=60)diffs.push(d)}
    if(!diffs.length)return 20;
    const counts={};diffs.forEach(d=>counts[d]=(counts[d]||0)+1);
    return Number(Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0][0])||20;
  };
  const slotEstimate = () => inferSlotMinutes();


  const plannedMatch = (m, overrides) => {
    const o=overrides.get(m.id);return o?{...m,time:o.time,court:o.court}:{...m};
  };
  const issueKey = (type, player, a, b) => `${type}|${player?.id||playerKey(player?.name||player)}|${[a,b].sort().join('|')}`;


  function scheduleRiskMap(overrides, affectedPlayers){
    const issues=new Map();
    const slot=slotEstimate(), rest=restMinutes();
    const active=scheduledMatches().filter(m=>m.status==='Scheduled'&&!m.actualStartAt).map(m=>plannedMatch(m,overrides));
    for(const player of affectedPlayers){
      const matches=active.filter(m=>window.__ppxPlayerIdentity?.containsIdentity?window.__ppxPlayerIdentity.containsIdentity(m,player.id):containsPlayer(m,player.name||player)).sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time)||a.court-b.court);
      for(let i=0;i<matches.length-1;i++){
        const a=matches[i],b=matches[i+1],ta=timeToMinutes(a.time),tb=timeToMinutes(b.time),gap=tb-ta;
        if(!Number.isFinite(gap))continue;
        if(gap===0){
          const key=issueKey('conflict',player,a.id,b.id);
          issues.set(key,{key,severity:'critical',title:`Schedule conflict — ${player.name||player}`,detail:`${a.id} (Court ${a.court}) and ${b.id} (Court ${b.court}) are both scheduled at ${a.time}.`,player,matches:[a.id,b.id]});
          continue;
        }
        const estimatedRest=gap-slot;
        if(gap<=slot){
          const key=issueKey('back-to-back',player,a.id,b.id);
          issues.set(key,{key,severity:'warning',title:`Back-to-back risk — ${player.name||player}`,detail:`${a.id} at ${a.time} is followed by ${b.id} at ${b.time} (${gap} min between starts). With an estimated ${slot}-minute match, there is about ${Math.max(0,estimatedRest)} min recovery before the next scheduled start.`,player,matches:[a.id,b.id]});
        }else if(estimatedRest<rest){
          const key=issueKey('rest-risk',player,a.id,b.id);
          issues.set(key,{key,severity:'warning',title:`Rest-window risk — ${player.name||player}`,detail:`${a.id} → ${b.id} leaves about ${estimatedRest} min scheduled recovery after an estimated ${slot}-minute match, below the configured ${rest}-minute minimum rest.`,player,matches:[a.id,b.id]});
        }
      }
    }
    return issues;
  }


  function buildMovePlan(id,court,time){
    const m=findMatch(id);
    if(!m)return{blocked:true,blockReason:'Match not found.'};
    if(m.status!=='Scheduled'||m.actualStartAt)return{blocked:true,blockReason:'Only an unstarted Scheduled match can be moved.'};
    if(!Number.isInteger(Number(court))||!EVENT_COURTS.includes(Number(court))||!time)return{blocked:true,blockReason:'Choose a valid destination court and time.'};
    court=Number(court);
    if(Number(m.court)===court&&m.time===time)return{blocked:true,noop:true,blockReason:'This match is already assigned to that court and time.'};
    const source={court:Number(m.court),time:m.time};
    const occupant=scheduledMatches().find(x=>x.id!==m.id&&Number(x.court)===court&&x.time===time)||null;
    if(occupant && state.settings?.closedCourts?.[source.court])return{blocked:true,blockReason:`Court ${source.court} is closed. A swap cannot move ${occupant.id} into that unavailable source court.`};
    if(occupant && (occupant.status!=='Scheduled'||occupant.actualStartAt)){
      return{blocked:true,blockReason:`Court ${court} at ${time} is occupied by ${occupant.id}, which has already started or been resolved. That slot cannot be displaced.`};
    }
    const changes=[{id:m.id,fromCourt:source.court,fromTime:source.time,toCourt:court,toTime:time}];
    if(occupant)changes.push({id:occupant.id,fromCourt:Number(occupant.court),fromTime:occupant.time,toCourt:source.court,toTime:source.time,swapped:true});
    const overrides=new Map(changes.map(c=>[c.id,{court:c.toCourt,time:c.toTime}]));
    const affectedPlayers=(()=>{const map=new Map();for(const c of changes){const m=findMatch(c.id),refs=window.__ppxPlayerIdentity?.matchPlayerRefs?window.__ppxPlayerIdentity.matchPlayerRefs(m):matchPlayers(m).map(name=>({id:playerKey(name),name}));for(const r of refs)if(!map.has(r.id))map.set(r.id,r)}return[...map.values()]})();
    const before=scheduleRiskMap(new Map(),affectedPlayers),after=scheduleRiskMap(overrides,affectedPlayers);
    const newIssues=[...after.values()].filter(x=>!before.has(x.key));
    const persistent=[...after.values()].filter(x=>before.has(x.key) && x.matches.some(mid=>changes.some(c=>c.id===mid)));
    const resolved=[...before.values()].filter(x=>!after.has(x.key) && x.matches.some(mid=>changes.some(c=>c.id===mid))).map(x=>({...x,severity:'resolved'}));
    const critical=newIssues.filter(x=>x.severity==='critical');
    const warnings=newIssues.filter(x=>x.severity==='warning');
    return{blocked:false,match:m,occupant,changes,overrides,affectedPlayers,newIssues,persistent,resolved,critical,warnings,slotMinutes:slotEstimate(),restMinutes:restMinutes()};
  }


  const impactItem = item => `<div class="impact-item ${esc(item.severity)}"><i class="impact-dot"></i><div><b>${esc(item.title)}</b><small>${esc(item.detail)}</small></div></div>`;
  const changeCard = c => {const m=findMatch(c.id);return `<div class="impact-route-card"><small>${esc(c.id)} · ${esc(m?.division||'Match')}</small><b>${esc(teamNamesText(m?.teamA))}<br>vs ${esc(teamNamesText(m?.teamB))}</b><span>Court ${c.fromCourt} · ${esc(c.fromTime)}</span></div>`};
  const destCard = c => {const m=findMatch(c.id);return `<div class="impact-route-card"><small>${esc(c.id)} NEW SLOT</small><b>Court ${c.toCourt} · ${esc(c.toTime)}</b><span>${esc(m?.division||'')} · ${esc(m?.stage||'')}</span></div>`};


  function openMoveImpact(plan){
    pendingMovePlan=plan;
    const modal=document.querySelector('#modalBackdrop .modal');modal?.classList.remove('customizer-mode');
    document.getElementById('modalTitle').innerHTML=`<div class="modal-title-stack"><h2>Schedule Move Impact</h2><div class="modal-subtitle">Review the ripple effect before committing this schedule change.</div></div>`;
    const primary=plan.changes[0];
    const newItems=plan.newIssues.length?plan.newIssues.map(impactItem).join(''):'<div class="impact-empty">No new player schedule conflict or rest-window risk was detected from this move.</div>';
    const resolved=plan.resolved.length?`<div class="impact-group"><div class="impact-group-head"><b>Risks resolved by this move</b><span>${plan.resolved.length}</span></div><div class="impact-list">${plan.resolved.map(impactItem).join('')}</div></div>`:'';
    const persistent=plan.persistent.length?`<div class="impact-group"><div class="impact-group-head"><b>Existing risks that remain</b><span>${plan.persistent.length}</span></div><div class="impact-list">${plan.persistent.map(impactItem).join('')}</div></div>`:'';
    document.getElementById('modalBody').innerHTML=`<div class="schedule-impact-summary">
      <div class="impact-route">${changeCard(primary)}<div class="impact-route-arrow">→</div>${destCard(primary)}</div>
      ${plan.occupant?`<div class="impact-banner swap"><strong>Destination slot is occupied — this will be a swap.</strong><span>${esc(plan.occupant.id)} will move into ${esc(primary.id)}'s previous slot: Court ${primary.fromCourt} · ${esc(primary.fromTime)}. No match will be deleted.</span></div>`:''}
      <div class="impact-banner ${plan.critical.length?'blocked':''}"><strong>${plan.critical.length?`${plan.critical.length} hard schedule conflict${plan.critical.length===1?'':'s'} detected`:`Ripple analysis complete`}</strong><span>The forecast uses the published start times, an estimated ${plan.slotMinutes}-minute match slot, and the configured ${plan.restMinutes}-minute player rest rule. Actual tournament readiness will still be enforced from real Actual End timestamps.</span></div>
      <div class="impact-group"><div class="impact-group-head"><b>New consequences</b><span>${plan.newIssues.length}</span></div><div class="impact-list">${newItems}</div></div>
      ${resolved}${persistent}
      <div class="impact-footer-note">Proceeding changes the published court/time assignment only. It does not bypass check-in, active-player, court-occupancy, or actual rest-time safeguards in Match Control.</div>
      <div class="impact-modal-actions"><button class="btn" onclick="cancelScheduleMoveImpact()">Cancel</button><button class="btn primary" onclick="commitScheduleMoveImpact()" ${plan.critical.length?'disabled title="Resolve hard same-time player conflicts before moving this match."':''}>Proceed</button></div>
    </div>`;
    const close=document.getElementById('closeModal');if(close)close.onclick=cancelScheduleMoveImpact;
    document.getElementById('modalBackdrop').classList.add('open');
  }


  window.cancelScheduleMoveImpact=function(){pendingMovePlan=null;document.getElementById('modalBackdrop')?.classList.remove('open')};
  window.commitScheduleMoveImpact=function(){
    const plan=pendingMovePlan;if(!plan)return false;
    if(plan.critical?.length){toast('Schedule move blocked: resolve hard same-time player conflicts first.');return false}
    for(const c of plan.changes){const m=findMatch(c.id);if(!m)continue;m.court=c.toCourt;m.time=c.toTime;m.scheduleModified=true;m.removedFromSchedule=false;}
    const p=plan.changes[0],swap=plan.changes[1];
    pendingMovePlan=null;document.getElementById('modalBackdrop')?.classList.remove('open');
    saveState(swap?`${p.id} moved to Court ${p.toCourt} at ${p.toTime}; ${swap.id} swapped to Court ${swap.toCourt} at ${swap.toTime} after ripple analysis`:`${p.id} moved to Court ${p.toCourt} at ${p.toTime} after ripple analysis`);
    toast(swap?'Schedule swap committed.':'Schedule move committed.');
  };
  window.requestScheduleMove=function(id,court,time){
    const plan=buildMovePlan(id,Number(court),time);
    if(plan.blocked){toast(plan.blockReason);return false}
    openMoveImpact(plan);return true;
  };


  // The form-based Move Scheduled Match uses the same impact analysis as drag/drop.
  window.saveScheduleMove=function(id){
    const m=findMatch(id);if(!m||m.status!=='Scheduled'||m.actualStartAt){toast('Only an unstarted scheduled match can be moved.');return}
    const court=Number(document.getElementById('moveCourt')?.value),time=scheduleDisplayTime(document.getElementById('moveTime')?.value);
    if(!Number.isInteger(court)||!EVENT_COURTS.includes(court)||!time){toast('Choose a valid court and scheduled time.');return}
    requestScheduleMove(id,court,time);
  };


  window.scheduleDragStart=function(e,id){
    const m=findMatch(id);if(!m||m.status!=='Scheduled'||m.actualStartAt){e.preventDefault();toast('Only unstarted scheduled matches can be dragged.');return}
    dragMatchId=id;dragRecently=false;e.currentTarget?.classList.add('schedule-dragging');
    try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id)}catch(_){}
  };
  window.scheduleDragEnd=function(e){e.currentTarget?.classList.remove('schedule-dragging');document.querySelectorAll('.schedule-drop-cell').forEach(el=>el.classList.remove('drag-over','drag-blocked'));setTimeout(()=>{dragMatchId=null;dragRecently=false},80)};
  window.scheduleDragOver=function(e){if(!dragMatchId)return;e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(_){};document.querySelectorAll('.schedule-drop-cell.drag-over').forEach(el=>{if(el!==e.currentTarget)el.classList.remove('drag-over')});e.currentTarget.classList.add('drag-over')};
  window.scheduleDragLeave=function(e){e.currentTarget.classList.remove('drag-over')};
  window.scheduleDrop=function(e,court,time){e.preventDefault();e.currentTarget.classList.remove('drag-over');const id=dragMatchId||(()=>{try{return e.dataTransfer.getData('text/plain')}catch(_){return''}})();if(!id)return;dragRecently=true;requestScheduleMove(id,Number(court),time)};
  window.scheduleCardClick=function(e,id){if(dragRecently){e.preventDefault();e.stopPropagation();dragRecently=false;return}openMatch(id)};
  window.openTouchMoveEditor=function(id){openMatch(id);setTimeout(()=>{const p=document.getElementById('moveSchedulePanel');if(p&&p.hidden)toggleMoveSchedulePanel(id)},0)};


  // Schedule renderer is defined once in the core Animo event layer.
  renderScheduleOnly();
})();
</script>




<script id="acms-admin-player-profiles-v421">
(() => {
  const coreOpenMatch = window.openMatch;
  function playerButton(name, extraClass=''){
    if(!name)return '';
    return `<button type="button" class="player-link ${extraClass}" draggable="false" data-player="${esc(name)}" onpointerdown="event.stopPropagation()" ondragstart="event.preventDefault();event.stopPropagation()" onclick="event.stopPropagation();openPlayerProfile(this.dataset.player)">${esc(name)}</button>`;
  }
  function clickableTeamNames(code, separator=' / '){
    const names=teamPlayers(code);
    if(!names.length)return esc(code||'TBD');
    return names.map(n=>playerButton(n)).join(separator);
  }
  function teamForPlayer(name){
    const key=playerKey(name);
    return BASE_DATA.teams.find(t=>(t.players||[]).some(p=>playerKey(p)===key))||null;
  }
  function bracketProgress(team){
    if(!team)return {done:0,total:0,complete:false};
    const ms=state.matches.filter(m=>m.division===team.division&&m.bracket===team.bracket);
    const done=ms.filter(m=>['Completed','Forfeit'].includes(m.status)&&matchWinner(m)).length;
    return {done,total:ms.length,complete:ms.length>0&&done===ms.length};
  }
  function profileMatches(team){
    if(!team)return [];
    return allMatches().filter(m=>m.teamA===team.code||m.teamB===team.code).sort(scheduleSort);
  }
  function profileMatchInfo(m,team){
    const isA=m.teamA===team.code;
    const oppCode=isA?m.teamB:m.teamA;
    const opponent=oppCode?teamNamesText(oppCode):'TBD';
    const own=isA?m.scoreA:m.scoreB,opp=isA?m.scoreB:m.scoreA;
    const finished=['Completed','Forfeit'].includes(m.status)&&matchWinner(m);
    const win=finished?matchWinner(m)===team.code:null;
    const result=m.status==='Forfeit'?(win?'W':'L'):(finished&&own!=null&&opp!=null?`${own}–${opp}`:'—');
    return {oppCode,opponent,own,opp,finished,win,result};
  }
  function availabilityProfile(player){
    const a=playerAvailability(player,'__admin_player_profile__');
    if(a.state==='playing')return {state:'playing',label:'Playing',detail:`Court ${a.match?.court||'—'} · ${a.match?.id||''} · ${a.match?.status||'Live'}`};
    if(a.state==='resting')return {state:'resting',label:'Resting',detail:`Recovery until ${fmtTime(a.readyAt)} after ${a.match?.id||'previous match'}`};
    return {state:'ready',label:'Ready',detail:'Player is currently available.'};
  }
  function playerProfileHtml(player){
    const team=teamForPlayer(player);
    if(!team)return `<div class="player-profile-empty">Player not found in the official Animo roster.</div>`;
    const partner=(team.players||[]).find(p=>playerKey(p)!==playerKey(player));
    const rows=standingsFor(team.division,team.bracket);
    const row=rows.find(r=>r.code===team.code)||{w:0,l:0,pe:0,pc:0,pq:0,gp:0};
    const rankIndex=rows.findIndex(r=>r.code===team.code);
    const progress=bracketProgress(team);
    const rank=row.gp&&rankIndex>=0?`#${rankIndex+1}`:'—';
    const standingLabel=row.gp?(progress.complete?'Final bracket standing':'Provisional bracket standing'):'No completed preliminary matches yet';
    const matches=profileMatches(team);
    const current=matches.find(m=>['Live','Hold','Timeout'].includes(m.status));
    const upcoming=matches.find(m=>m.status==='Scheduled'&&!m.removedFromSchedule);
    const availability=availabilityProfile(player);
    const nextText=current?`${current.id} · Court ${current.court} · ${current.status}`:upcoming?`${upcoming.id} · ${upcoming.time} · Court ${upcoming.court}`:'No remaining scheduled match';
    const list=matches.map(m=>{
      const info=profileMatchInfo(m,team);
      const resultClass=m.status==='Live'||m.status==='Hold'?'live':info.finished?(info.win?'win':'loss'):'';
      const resultMain=m.status==='Live'?'LIVE':m.status==='Hold'?'HOLD':info.finished?(info.win?'W':'L'):(m.removedFromSchedule?'UNSCHEDULED':m.status.toUpperCase());

<script id="acms-player-view-config-v424">

  const PV_DEFAULTS={leaderboardScope:'bracket',leaderboardPrimary:'team',showTeamPlayers:true,leaderboardColumns:{rank:true,team:true,w:true,l:true,pe:true,pc:true,pq:true,status:true},showUpcoming:true,upcomingLimit:0,showCompleted:true,completedLimit:0,headerFields:{teamCode:true,hospital:true,division:true,bracket:true,partner:true,checkin:true,availability:true},matchFields:{time:true,court:true,opponent:true,status:true,score:true},detailFields:{players:true,timing:true,notes:true}};
  const merge=(base,raw)=>{const out={...base,...(raw||{})};for(const k of ['leaderboardColumns','headerFields','matchFields','detailFields'])out[k]={...base[k],...((raw||{})[k]||{})};return out};
  const cfg=()=>merge(PV_DEFAULTS,state.settings?.playerView);
  const ck=(id,label,on)=>`<label class="pv-check"><input id="${id}" type="checkbox" ${on?'checked':''}><span>${label}</span></label>`;
  function playerViewSettingsCard(){const c=cfg(),lc=c.leaderboardColumns,h=c.headerFields,m=c.matchFields,d=c.detailFields;return `<div class="card settings-card pv-config-card"><div class="settings-title"><span>08</span><h3>Player View</h3></div><p class="muted small">Configure what admins see when a player name opens the My Matches view. These settings apply to every player.</p><div class="pv-config-groups"><div class="pv-config-group"><h4>Leaderboard</h4><div class="settings-fields"><div class="field full"><label>Scope</label><select id="pvLeaderboardScope"><option value="bracket" ${c.leaderboardScope==='bracket'?'selected':''}>Assigned bracket only</option><option value="division" ${c.leaderboardScope==='division'?'selected':''}>Entire division · brackets shown separately</option><option value="hidden" ${c.leaderboardScope==='hidden'?'selected':''}>Hide leaderboard</option></select></div><div class="field full"><label>Primary label</label><select id="pvLeaderboardPrimary"><option value="players" ${c.leaderboardPrimary==='players'?'selected':''}>Player names</option><option value="team" ${c.leaderboardPrimary!=='players'?'selected':''}>Team code / hospital</option></select></div></div><div class="pv-check-grid">${ck('pvShowTeamPlayers','Show secondary line',c.showTeamPlayers)}${ck('pvColRank','Rank',lc.rank)}${ck('pvColTeam','Team / hospital',lc.team)}${ck('pvColW','Wins',lc.w)}${ck('pvColL','Losses',lc.l)}${ck('pvColPE','PE',lc.pe)}${ck('pvColPC','PC',lc.pc)}${ck('pvColPQ','PQ',lc.pq)}${ck('pvColStatus','Status',lc.status)}</div></div><div class="pv-config-group"><h4>Player Header</h4><div class="pv-check-grid">${ck('pvHeadTeam','Team code',h.teamCode)}${ck('pvHeadHospital','Hospital',h.hospital)}${ck('pvHeadDivision','Division',h.division)}${ck('pvHeadBracket','Bracket',h.bracket)}${ck('pvHeadPartner','Partner',h.partner)}${ck('pvHeadCheckin','Check-in status',h.checkin)}${ck('pvHeadAvailability','Ready / Playing / Resting',h.availability)}</div></div><div class="pv-config-group"><h4>Match Sections</h4><div class="pv-check-grid">${ck('pvShowUpcoming','Show Upcoming Matches',c.showUpcoming)}${ck('pvShowCompleted','Show Completed Matches',c.showCompleted)}</div><div class="settings-fields" style="margin-top:9px"><div class="field"><label>Upcoming shown</label><select id="pvUpcomingLimit">${[0,1,2,3,5,10].map(n=>`<option value="${n}" ${Number(c.upcomingLimit)===n?'selected':''}>${n===0?'All':n}</option>`).join('')}</select></div><div class="field"><label>Completed shown</label><select id="pvCompletedLimit">${[0,1,2,3,5,10].map(n=>`<option value="${n}" ${Number(c.completedLimit)===n?'selected':''}>${n===0?'All':n}</option>`).join('')}</select></div></div><div class="pv-check-grid" style="margin-top:8px">${ck('pvMatchTime','Scheduled time',m.time)}${ck('pvMatchCourt','Court',m.court)}${ck('pvMatchOpponent','Opponent',m.opponent)}${ck('pvMatchStatus','Match status',m.status)}${ck('pvMatchScore','Score / result',m.score)}</div></div><div class="pv-config-group"><h4>Expanded Match Details</h4><div class="pv-check-grid">${ck('pvDetailPlayers','Players',d.players)}${ck('pvDetailTiming','Actual timing',d.timing)}${ck('pvDetailNotes','Notes / incidents',d.notes)}</div><p class="pv-config-note">Open Match Control remains available even when detail fields are hidden.</p></div></div><div class="pv-config-actions"><button class="btn" onclick="resetPlayerViewSettings()">Restore Defaults</button><button class="btn primary" onclick="savePlayerViewSettings()">Save Player View</button></div></div>`;}
  const oldSettings=settingsSection;settingsSection=function(){let html=oldSettings();html=html.replace('<div class="card settings-card audit-card"><div class="settings-title"><span>09</span><h3>Audit Log</h3>',playerViewSettingsCard()+'<div class="card settings-card audit-card"><div class="settings-title"><span>09</span><h3>Audit Log</h3>');return html};
  const val=id=>document.getElementById(id);
  window.savePlayerViewSettings=function(){const c={leaderboardScope:val('pvLeaderboardScope')?.value||'bracket',leaderboardPrimary:val('pvLeaderboardPrimary')?.value||'team',showTeamPlayers:!!val('pvShowTeamPlayers')?.checked,leaderboardColumns:{rank:!!val('pvColRank')?.checked,team:!!val('pvColTeam')?.checked,w:!!val('pvColW')?.checked,l:!!val('pvColL')?.checked,pe:!!val('pvColPE')?.checked,pc:!!val('pvColPC')?.checked,pq:!!val('pvColPQ')?.checked,status:!!val('pvColStatus')?.checked},showUpcoming:!!val('pvShowUpcoming')?.checked,upcomingLimit:Number(val('pvUpcomingLimit')?.value||0),showCompleted:!!val('pvShowCompleted')?.checked,completedLimit:Number(val('pvCompletedLimit')?.value||0),headerFields:{teamCode:!!val('pvHeadTeam')?.checked,hospital:!!val('pvHeadHospital')?.checked,division:!!val('pvHeadDivision')?.checked,bracket:!!val('pvHeadBracket')?.checked,partner:!!val('pvHeadPartner')?.checked,checkin:!!val('pvHeadCheckin')?.checked,availability:!!val('pvHeadAvailability')?.checked},matchFields:{time:!!val('pvMatchTime')?.checked,court:!!val('pvMatchCourt')?.checked,opponent:!!val('pvMatchOpponent')?.checked,status:!!val('pvMatchStatus')?.checked,score:!!val('pvMatchScore')?.checked},detailFields:{players:!!val('pvDetailPlayers')?.checked,timing:!!val('pvDetailTiming')?.checked,notes:!!val('pvDetailNotes')?.checked}};if(c.leaderboardScope!=='hidden'&&!Object.values(c.leaderboardColumns).some(Boolean)){toast('Keep at least one leaderboard column enabled, or hide the leaderboard.');return}state.settings=state.settings||{};state.settings.playerView=c;saveState('Player View display configuration updated');toast('Player View settings saved.');};
  window.resetPlayerViewSettings=function(){if(!confirm('Restore the default Player View layout?'))return;state.settings=state.settings||{};state.settings.playerView=JSON.parse(JSON.stringify(PV_DEFAULTS));saveState('Player View display configuration restored to defaults');toast('Player View defaults restored.');};
  // Migrate old/local states to a complete configuration without overwriting user choices.
  state.settings=state.settings||{};{const before=JSON.stringify(state.settings.playerView||{});state.settings.playerView=merge(PV_DEFAULTS,state.settings.playerView);if(before!==JSON.stringify(state.settings.playerView))commitState('Player View defaults normalized',{render:false})}
  try{renderAll();}catch(e){console.error('Player View settings render failed',e)}
})();
</script>




<script id="acms-registration-ops-v430">
(() => {
  window.__regopsTab=window.__regopsTab||'teams';window.__regopsQuery=window.__regopsQuery||'';window.__regopsDivision=window.__regopsDivision||'All';window.__regopsStatus=window.__regopsStatus||'All';window.__regopsSelected=window.__regopsSelected||new Set();if(!window.__regopsSort){try{window.__regopsSort=localStorage.getItem('acms_regops_sort_v1')||'code-asc'}catch(e){window.__regopsSort='code-asc'}};if(!window.__regopsCheckinFilter){try{window.__regopsCheckinFilter=localStorage.getItem('animo_regops_checkin_filter_v1')||'all'}catch(e){window.__regopsCheckinFilter='all'}}
  function reg(){state.registration=state.registration||{};state.registration.playerCheckin=state.registration.playerCheckin||{};state.registration.teamDisqualified=state.registration.teamDisqualified||{};state.registration.jerseyClaims=state.registration.jerseyClaims&&typeof state.registration.jerseyClaims==='object'?state.registration.jerseyClaims:{};state.registration.jerseyClaimAudit=Array.isArray(state.registration.jerseyClaimAudit)?state.registration.jerseyClaimAudit:[];for(const t of BASE_DATA.teams){if(!Array.isArray(state.registration.playerCheckin[t.code]))state.registration.playerCheckin[t.code]=[Boolean(state.checkin?.[t.code]),Boolean(state.checkin?.[t.code])];if(typeof state.registration.teamDisqualified[t.code]!=='boolean')state.registration.teamDisqualified[t.code]=false;}return state.registration}
  function teamPresent(code){const a=reg().playerCheckin[code]||[false,false];return a.filter(Boolean).length}
  function teamComplete(t){return Boolean(t?.code&&t?.hospital&&t?.division&&t?.bracket&&Array.isArray(t.players)&&t.players.length===2&&t.players.every(Boolean))}
  function teamRegStatus(t){if(reg().teamDisqualified[t.code])return'Disqualified';return teamComplete(t)?'Complete':'Incomplete'}
  function duplicateCodeCount(){const seen=new Set(),dups=new Set();for(const t of BASE_DATA.teams){const c=String(t.code||'').toUpperCase();if(seen.has(c))dups.add(c);seen.add(c)}return dups.size}
  function uniquePlayerCount(){return new Set(BASE_DATA.teams.flatMap(t=>t.players||[]).map(playerKey).filter(Boolean)).size}
  function regopsText(v){return String(v??'').trim().toLocaleLowerCase()}
  function regopsCompareText(a,b){return regopsText(a).localeCompare(regopsText(b),undefined,{numeric:true,sensitivity:'base'})}
  function sortedRegopsTeams(list){const sort=window.__regopsSort||'code-asc',dir=sort.endsWith('-desc')?-1:1,key=sort.replace(/-(asc|desc)$/,'');return [...list].sort((a,b)=>{let av='',bv='';if(key==='code'){av=a.code;bv=b.code}else if(key==='hospital'){av=`${a.hospital} ${hospitalName(a.hospital)}`;bv=`${b.hospital} ${hospitalName(b.hospital)}`}else if(key==='player1'){av=a.players?.[0]||'';bv=b.players?.[0]||''}else if(key==='player2'){av=a.players?.[1]||'';bv=b.players?.[1]||''}else if(key==='division'){av=`${a.division} ${a.bracket}`;bv=`${b.division} ${b.bracket}`}else if(key==='bracket'){av=`${a.bracket} ${a.division}`;bv=`${b.bracket} ${b.division}`}else if(key==='checkin'){av=teamPresent(a.code);bv=teamPresent(b.code);if(av!==bv)return (av-bv)*dir;av=a.code;bv=b.code}else if(key==='matches'){av=teamMatchCount(a.code);bv=teamMatchCount(b.code);if(av!==bv)return (av-bv)*dir;av=a.code;bv=b.code}else if(key==='status'){const order={Incomplete:0,Disqualified:1,Complete:2};av=order[teamRegStatus(a)]??9;bv=order[teamRegStatus(b)]??9;if(av!==bv)return (av-bv)*dir;av=a.code;bv=b.code}const c=regopsCompareText(av,bv);return c!==0?c*dir:regopsCompareText(a.code,b.code)})}
  function baseFilteredTeams(){const q=(window.__regopsQuery||'').trim().toLowerCase(),div=window.__regopsDivision||'All',st=window.__regopsStatus||'All';return BASE_DATA.teams.filter(t=>{const status=teamRegStatus(t);return(div==='All'||t.division===div)&&(st==='All'||status===st)&&(!q||[t.code,t.hospital,hospitalName(t.hospital),t.division,t.bracket,...(t.players||[])].join(' ').toLowerCase().includes(q))})}
  function checkinFilterMatches(t,filter){const dq=Boolean(reg().teamDisqualified[t.code]),complete=teamComplete(t),n=teamPresent(t.code);switch(filter){case'ready':return complete&&!dq&&n===2;case'partial':return complete&&!dq&&n===1;case'waiting':return complete&&!dq&&n===0;case'incomplete':return!complete;case'disqualified':return dq;case'attention':return dq||!complete||n<2;default:return true}}
  function filteredTeams(){let list=baseFilteredTeams();if(window.__regopsTab==='checkin')list=list.filter(t=>checkinFilterMatches(t,window.__regopsCheckinFilter||'all'));return sortedRegopsTeams(list)}
  function checkinFilterCounts(){const base=baseFilteredTeams(),counts={all:base.length,ready:0,partial:0,waiting:0,incomplete:0,disqualified:0,attention:0,playersPresent:0,playerSlots:0};for(const t of base){const dq=Boolean(reg().teamDisqualified[t.code]),complete=teamComplete(t),n=teamPresent(t.code);counts.playersPresent+=n;counts.playerSlots+=(t.players||[]).filter(Boolean).length;if(complete&&!dq&&n===2)counts.ready++;if(complete&&!dq&&n===1)counts.partial++;if(complete&&!dq&&n===0)counts.waiting++;if(!complete)counts.incomplete++;if(dq)counts.disqualified++;if(dq||!complete||n<2)counts.attention++;}return counts}
  window.setRegopsCheckinFilter=function(v){const allowed=['all','ready','partial','waiting','attention','incomplete','disqualified'],requested=allowed.includes(v)?v:'all';window.__regopsCheckinFilter=(requested!=='all'&&window.__regopsCheckinFilter===requested)?'all':requested;try{localStorage.setItem('animo_regops_checkin_filter_v1',window.__regopsCheckinFilter)}catch(e){}renderTeamsOnly()}
  function syncTeamReady(code){const r=reg(),a=r.playerCheckin[code]||[false,false];state.checkin[code]=a.length===2&&a.every(Boolean)&&!r.teamDisqualified[code]}
  window.setPlayerAttendance=function(code,index,val){const r=reg();r.playerCheckin[code]=Array.isArray(r.playerCheckin[code])?r.playerCheckin[code].slice(0,2):[false,false];r.playerCheckin[code][index]=Boolean(val);while(r.playerCheckin[code].length<2)r.playerCheckin[code].push(false);syncTeamReady(code);saveState(`${teamMap[code]?.players?.[index]||code} ${val?'checked in':'check-in removed'}`);};
  const coreSetCheckin=window.setCheckin;window.setCheckin=function(code,val){const r=reg(),now=val?new Date().toISOString():null;r.playerCheckin[code]=[Boolean(val),Boolean(val)];r.playerCheckinAt=r.playerCheckinAt||{};r.playerCheckinAt[code]=[now,now];state.checkin[code]=Boolean(val)&&!r.teamDisqualified[code];saveState(`${code} ${val?'team checked in':'team check-in removed'}`)};
  window.checkInTeam=function(code,val=true){setCheckin(code,val)};
  window.checkAll=function(val){for(const t of filteredTeams()){reg().playerCheckin[t.code]=[Boolean(val),Boolean(val)];state.checkin[t.code]=Boolean(val)&&!reg().teamDisqualified[t.code]}saveState(`Filtered teams ${val?'checked in':'check-in cleared'}`)};
  function csvEscape(v){const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
  function downloadCsv(name,rows){const csv=rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  window.exportRosterPlayers=function(){const rows=[['Team Code','Hospital Code','Hospital','Division','Bracket','Player 1','Player 2','Status','Player 1 Present','Player 2 Present','Matches']];for(const t of BASE_DATA.teams){const a=reg().playerCheckin[t.code]||[false,false];rows.push([t.code,t.hospital,hospitalName(t.hospital),t.division,t.bracket,t.players?.[0]||'',t.players?.[1]||'',teamRegStatus(t),a[0]?'Yes':'No',a[1]?'Yes':'No',teamMatchCount(t.code)])}downloadCsv('Animo_Pickleball_Cup_Players_and_Teams.csv',rows);toast('Player roster exported.')};
  window.exportRosterCheckin=function(){const rows=[['Team Code','Player','Hospital','Division','Bracket','Present','Team Ready','Disqualified']];for(const t of BASE_DATA.teams){const a=reg().playerCheckin[t.code]||[false,false];(t.players||[]).forEach((p,i)=>rows.push([t.code,p,hospitalName(t.hospital),t.division,t.bracket,a[i]?'Yes':'No',state.checkin[t.code]?'Yes':'No',reg().teamDisqualified[t.code]?'Yes':'No']))}downloadCsv('Animo_Pickleball_Cup_Event_CheckIn.csv',rows);toast('Check-in report exported.')};
  window.setRegopsTab=function(tab){window.__regopsTab=tab;renderTeamsOnly()};
  window.setRegopsQuery=function(v){window.__regopsQuery=v;const pos=v.length;renderTeamsOnly();setTimeout(()=>{const el=document.getElementById('regopsSearch');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}},0)};
  window.setRegopsDivision=function(v){window.__regopsDivision=v;renderTeamsOnly()};window.setRegopsStatus=function(v){window.__regopsStatus=v;renderTeamsOnly()};window.setRegopsSort=function(v){window.__regopsSort=v;try{localStorage.setItem('acms_regops_sort_v1',v)}catch(e){}renderTeamsOnly()};
  window.toggleRegopsHeaderSort=function(key,defaultDir='asc'){const current=window.__regopsSort||'code-asc',active=current.startsWith(key+'-'),dir=active?(current.endsWith('-asc')?'desc':'asc'):defaultDir;window.setRegopsSort(`${key}-${dir}`)};
  function regopsSortHeader(key,label,defaultDir='asc'){const current=window.__regopsSort||'code-asc',active=current.startsWith(key+'-'),dir=active?(current.endsWith('-desc')?'desc':'asc'):'';const indicator=active?(dir==='asc'?'▲':'▼'):'↕',aria=active?(dir==='asc'?'ascending':'descending'):'none';return `<th aria-sort="${aria}"><button type="button" class="regops-sort-head ${active?'active':''}" onclick="toggleRegopsHeaderSort('${key}','${defaultDir}')" title="Sort by ${esc(label)}${active?` · currently ${dir==='asc'?'ascending':'descending'}`:''}"><span>${esc(label)}</span><span class="regops-sort-indicator" aria-hidden="true">${indicator}</span></button></th>`}
  window.toggleRegopsSelect=function(code,on){if(on)window.__regopsSelected.add(code);else window.__regopsSelected.delete(code);renderTeamsOnly()};
  window.toggleRegopsSelectAll=function(on){for(const t of filteredTeams()){if(on)window.__regopsSelected.add(t.code);else window.__regopsSelected.delete(t.code)}renderTeamsOnly()};
  window.toggleTeamDisqualified=function(code){const t=teamMap[code];if(!t)return;const r=reg(),next=!r.teamDisqualified[code];if(!confirm(next?`Disqualify ${code}? The team will be blocked from starting future matches. Existing results will remain unchanged.`:`Reinstate ${code}? The team will become eligible again once both players are checked in.`))return;r.teamDisqualified[code]=next;if(next)state.checkin[code]=false;else syncTeamReady(code);saveState(`${code} ${next?'marked Disqualified':'reinstated'}`);toast(next?'Team disqualified. Future starts are blocked.':'Team reinstated.')};
  window.openTeamMatches=function(code){const t=teamMap[code];if(!t)return;const list=rosterAssignments(code);document.querySelector('#modalBackdrop .modal')?.classList.remove('roster-editor');document.getElementById('modalTitle').innerHTML=`<div class="modal-title-stack"><h2>${esc(code)} Match Assignments</h2><div class="modal-subtitle">${esc((t.players||[]).join(' / '))} · ${list.length} assignment${list.length===1?'':'s'}</div></div>`;document.getElementById('modalBody').innerHTML=`<div class="regops-modal-list">${list.map(m=>{const opp=m.teamA===code?m.teamB:m.teamA;return`<div class="regops-modal-row"><div><b>${esc(m.id)} · ${esc(m.time||'Unscheduled')} · Court ${esc(String(m.court||'—'))}</b><span>${esc(m.division)} · ${esc(m.stage)} · vs ${opp?esc(teamNamesText(opp)):'TBD'} · ${esc(adminDisplayMatchStatus(m))}</span></div><button class="btn tiny" onclick="openMatch('${esc(m.id)}')">Open Match</button></div>`}).join('')||'<div class="empty">No match assignments.</div>'}</div><div class="modal-actions"><button class="btn" onclick="document.getElementById('modalBackdrop').classList.remove('open')">Close</button></div>`;document.getElementById('modalBackdrop').classList.add('open')};
  window.openBulkDeleteReview=function(){const codes=[...window.__regopsSelected].filter(c=>teamMap[c]);if(!codes.length){toast('Select at least one team first.');return}const safe=codes.filter(c=>rosterAssignments(c).length===0),blocked=codes.filter(c=>rosterAssignments(c).length>0);document.getElementById('modalTitle').innerHTML=`<div class="modal-title-stack"><h2>Bulk Delete Review</h2><div class="modal-subtitle">${codes.length} selected team${codes.length===1?'':'s'}</div></div>`;document.getElementById('modalBody').innerHTML=`<div class="regops-bulk-note">Only teams with zero match assignments can be deleted in bulk. Assigned teams must go through the protected Delete workflow so schedule/history references are not broken.</div><div class="regops-modal-list">${codes.map(c=>`<div class="regops-modal-row"><div><b>${esc(c)} · ${esc((teamMap[c]?.players||[]).join(' / '))}</b><span>${rosterAssignments(c).length?`${rosterAssignments(c).length} assignment(s) · protected`:'No assignments · safe to delete'}</span></div><span class="regops-status ${rosterAssignments(c).length?'incomplete':'complete'}">${rosterAssignments(c).length?'Protected':'Deletable'}</span></div>`).join('')}</div><div class="modal-actions"><button class="btn" onclick="document.getElementById('modalBackdrop').classList.remove('open')">Cancel</button>${safe.length?`<button class="btn danger" onclick="bulkDeleteSafeTeams()">Delete ${safe.length} Safe Team${safe.length===1?'':'s'}</button>`:''}</div>`;document.getElementById('modalBackdrop').classList.add('open')};
  window.bulkDeleteSafeTeams=function(){const codes=[...window.__regopsSelected].filter(c=>teamMap[c]&&rosterAssignments(c).length===0);if(!codes.length){toast('No selected teams are safe to delete.');return}if(!confirm(`Permanently delete ${codes.length} unassigned team${codes.length===1?'':'s'}?`))return;for(const code of codes){const i=BASE_DATA.teams.findIndex(t=>t.code===code);if(i>=0)BASE_DATA.teams.splice(i,1);delete state.checkin[code];delete reg().playerCheckin[code];delete reg().teamDisqualified[code];window.__regopsSelected.delete(code)}rebuildTeamMap();state.roster=deepClone(BASE_DATA.teams);saveState(`Bulk deleted ${codes.length} unassigned roster entries`);document.getElementById('modalBackdrop')?.classList.remove('open');toast('Safe teams deleted.')};
  function checkinHtml(t){const a=reg().playerCheckin[t.code]||[false,false],n=a.filter(Boolean).length,dq=reg().teamDisqualified[t.code];return`<div class="regops-checkin"><b class="${n===2&&!dq?'ready':'partial'}">${n}/2 ${n===2&&!dq?'Ready':'Present'}</b>${n===2?`<button class="regops-mini" onclick="checkInTeam('${esc(t.code)}',false)">Undo</button>`:`<button class="regops-mini" onclick="checkInTeam('${esc(t.code)}',true)">Check In Team</button>`}</div>`}
  function teamRows(){return filteredTeams().map(t=>{const mc=teamMatchCount(t.code),status=teamRegStatus(t),dq=status==='Disqualified';return`<tr><td><input class="regops-selectbox" type="checkbox" ${window.__regopsSelected.has(t.code)?'checked':''} onchange="toggleRegopsSelect('${esc(t.code)}',this.checked)"></td><td><span class="regops-code">${esc(t.code)}</span></td><td><b>${esc(t.hospital)}</b><span class="regops-sub">${esc(hospitalName(t.hospital))}</span></td><td><div class="regops-player-cell">${rosterPlayerLink(t.players?.[0]||'')}</div></td><td><div class="regops-player-cell">${rosterPlayerLink(t.players?.[1]||'')}</div></td><td><b>${esc(t.division)}</b></td><td>${esc(t.bracket)}${Number.isInteger(t.bracketNumber)?`<span class="regops-sub">No. ${esc(String(t.bracketNumber))}</span>`:""}</td><td><span class="regops-status ${dq?'dq':status==='Complete'?'complete':'incomplete'}">${esc(status)}</span></td><td>${checkinHtml(t)}</td><td><button class="regops-link" onclick="openTeamMatches('${esc(t.code)}')">${mc} match${mc===1?'':'es'}</button></td><td><div class="regops-actions"><button class="btn" onclick="openRosterEditor('${esc(t.code)}')">Edit</button><button class="btn" onclick="openTeamMatches('${esc(t.code)}')">Matches</button><button class="btn warn" onclick="toggleTeamDisqualified('${esc(t.code)}')">${dq?'Reinstate':'Disqualify'}</button><button class="btn danger-strong" onclick="deleteRosterTeam('${esc(t.code)}')">Delete</button></div></td></tr>`}).join('')}
  function playerRegistryRows(){
    const out=[];
    for(const t of filteredTeams()){
      const attendance=reg().playerCheckin[t.code]||[false,false];
      (t.players||[]).forEach((player,index)=>{
        const identityRef=window.__ppxPlayerIdentity?.occurrenceRefs().find(r=>r.code===t.code&&r.slot===index);
        const availability=identityRef?window.__ppxPlayerIdentity.availabilityForRef(identityRef,'__registry__'):playerAvailability(player,'__registry__');
        const availabilityLabel=availability.state==='ready'?'Ready':availability.state==='playing'?'Playing':availability.state==='resting'?'Resting':'Unavailable';

<script id="acms-v448-click-add-schedule-js">
(()=>{
  const section=()=>document.getElementById('section-schedule');
  const slotAt=(court,time)=>scheduledMatches().find(m=>Number(m.court)===Number(court)&&m.time===time)||null;
  const closedCourt=court=>Boolean(state.settings?.closedCourts?.[Number(court)]||state.settings?.closedCourts?.[String(court)]);
  const freeCourtsAt=time=>EVENT_COURTS.filter(c=>!slotAt(c,time)&&!closedCourt(c));
  const unscheduledCandidates=()=>allMatches().filter(m=>m.removedFromSchedule===true&&m.status==='Scheduled'&&!m.actualStartAt).sort(scheduleSort);
  const selectedCourt=()=>Number(document.getElementById('scheduleAddCourt')?.value||0);
  const targetTime=()=>document.getElementById('scheduleAddTime')?.value||'';
  const safeClose=()=>document.getElementById('modalBackdrop')?.classList.remove('open');


  function nextPrelimId(){
    const nums=state.matches.map(m=>String(m.id||'').match(/^P(\d+)$/i)).filter(Boolean).map(m=>Number(m[1])).filter(Number.isFinite);
    const n=Math.max(80,...nums)+1;return `P${String(n).padStart(3,'0')}`;
  }
  function selectedFilterDivision(){const v=document.getElementById('scheduleDivision')?.value||'All';return v==='All'?'':v}
  function divisionOptions(selected=''){
    const divs=[...new Set(BASE_DATA.teams.map(t=>t.division).filter(Boolean))];
    return divs.map(d=>`<option value="${esc(d)}" ${d===selected?'selected':''}>${esc(d)}</option>`).join('');
  }
  function availableBrackets(div){return [...new Set(BASE_DATA.teams.filter(t=>t.division===div).map(t=>t.bracket).filter(Boolean))].sort()}
  function teamOptions(div,br,selected=''){
    return `<option value="">Select team</option>`+BASE_DATA.teams.filter(t=>t.division===div&&t.bracket===br).map(t=>`<option value="${esc(t.code)}" ${t.code===selected?'selected':''}>${esc(t.code)} · ${esc(teamNamesText(t.code))}</option>`).join('');
  }
  window.refreshScheduleAddTeams=function(){
    const div=document.getElementById('scheduleAddDivision')?.value||'';
    const brSel=document.getElementById('scheduleAddBracket');if(!brSel)return;
    const prior=brSel.value,brs=availableBrackets(div);brSel.innerHTML=brs.map(b=>`<option value="${esc(b)}" ${b===prior?'selected':''}>Bracket ${esc(b)}</option>`).join('');
    if(!brs.includes(brSel.value)&&brs.length)brSel.value=brs[0];
    const br=brSel.value||brs[0]||'';
    const a=document.getElementById('scheduleAddTeamA'),b=document.getElementById('scheduleAddTeamB');if(a)a.innerHTML=teamOptions(div,br);if(b)b.innerHTML=teamOptions(div,br);
  };
  window.refreshScheduleAddBracketTeams=function(){
    const div=document.getElementById('scheduleAddDivision')?.value||'',br=document.getElementById('scheduleAddBracket')?.value||'';
    const a=document.getElementById('scheduleAddTeamA'),b=document.getElementById('scheduleAddTeamB');if(a)a.innerHTML=teamOptions(div,br);if(b)b.innerHTML=teamOptions(div,br);
  };
  window.openScheduleCellAdd=function(court,time){
    court=Number(court)||0;time=String(time||'').trim();if(!time)return;
    if(court){const occupant=slotAt(court,time);if(occupant){toast(`Court ${court} at ${time} is occupied by ${occupant.id}.`);openMatch(occupant.id);return}if(closedCourt(court)){toast(`Court ${court} is closed. Reopen it in Settings before scheduling a match.`);return}}
    const free=freeCourtsAt(time);if(!court&&!free.length){toast(`No open court is available at ${time}.`);return}
    const chosenCourt=court||free[0];
    const existing=unscheduledCandidates();
    const initialDiv=selectedFilterDivision()||BASE_DATA.teams[0]?.division||'';
    const brackets=availableBrackets(initialDiv),initialBr=brackets[0]||'';
    const modal=document.querySelector('#modalBackdrop .modal');modal?.classList.remove('customizer-mode','player-profile-modal');
    document.getElementById('modalTitle').innerHTML=`<div class="modal-title-stack"><h2>Add Match to Schedule</h2><div class="modal-subtitle">Create or restore a schedule card directly from this court/time slot.</div></div>`;
    document.getElementById('modalBody').innerHTML=`<div class="schedule-add-form">
      <input id="scheduleAddTime" type="hidden" value="${esc(time)}">
      <div class="schedule-add-target"><div><small>Scheduled time</small><b>${esc(time)}</b></div><div><small>Court</small>${court?`<b>Court ${court}</b><input id="scheduleAddCourt" type="hidden" value="${court}">`:`<select id="scheduleAddCourt">${free.map(c=>`<option value="${c}">Court ${c}</option>`).join('')}</select>`}</div></div>
      <section class="schedule-add-section"><h3>Schedule an existing match</h3><p>Use this for a match that was previously removed from the matrix. Its match record, teams and scoring history remain intact.</p>
        ${existing.length?`<div class="field"><label>Unscheduled match</label><select id="scheduleExistingMatch">${existing.map(m=>`<option value="${esc(m.id)}">${esc(m.id)} · ${esc(teamNamesText(m.teamA))} vs ${esc(teamNamesText(m.teamB))} · ${esc(m.division)}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn primary" onclick="scheduleExistingMatchIntoCell()">Add Existing Match</button></div>`:`<div class="empty compact">No unscheduled match records are currently available.</div>`}
      </section>
      <div class="schedule-add-divider">or</div>
      <section class="schedule-add-section"><h3>Create an additional preliminary match</h3><p>This creates a new official preliminary record. It will count in standings and tournament integrity checks, so duplicate pairings are blocked.</p>
        <div class="schedule-add-grid">
          <div class="field"><label>Division</label><select id="scheduleAddDivision" onchange="refreshScheduleAddTeams()">${divisionOptions(initialDiv)}</select></div>
          <div class="field"><label>Bracket</label><select id="scheduleAddBracket" onchange="refreshScheduleAddBracketTeams()">${brackets.map(b=>`<option value="${esc(b)}">Bracket ${esc(b)}</option>`).join('')}</select></div>
          <div class="field"><label>Team A</label><select id="scheduleAddTeamA">${teamOptions(initialDiv,initialBr)}</select></div>
          <div class="field"><label>Team B</label><select id="scheduleAddTeamB">${teamOptions(initialDiv,initialBr)}</select></div>
        </div>
        <div class="schedule-add-warning">The new match receives the next available P-number and uses the standard Preliminary scoring rule: race to 11, win by 2 (no cap).</div>
        <div class="modal-actions"><button class="btn" onclick="${'safeCloseScheduleAdd()'}">Cancel</button><button class="btn primary" onclick="createScheduleMatchFromCell()">Create Match</button></div>
      </section>
    </div>`;
    const close=document.getElementById('closeModal');if(close)close.onclick=safeClose;
    document.getElementById('modalBackdrop')?.classList.add('open');
  };
  window.safeCloseScheduleAdd=safeClose;
  window.scheduleExistingMatchIntoCell=function(){
    const id=document.getElementById('scheduleExistingMatch')?.value||'',m=findMatch(id),court=selectedCourt(),time=targetTime();
    if(!m||!m.removedFromSchedule||m.status!=='Scheduled'||m.actualStartAt){toast('Choose a valid unscheduled, unstarted match.');return}
    if(!court||!time){toast('Choose a valid court and time.');return}if(closedCourt(court)){toast(`Court ${court} is closed.`);return}
    const occ=slotAt(court,time);if(occ){toast(`Court ${court} at ${time} is already occupied by ${occ.id}.`);return}
    const conflict=scheduledMatches().find(x=>x.id!==m.id&&x.time===time&&[m.teamA,m.teamB].some(code=>code&&[x.teamA,x.teamB].includes(code)));
    if(conflict){toast(`${m.id} cannot be scheduled at ${time}: one of its teams is already assigned to ${conflict.id}.`);return}
    m.court=court;m.time=time;m.removedFromSchedule=false;m.scheduleModified=true;
    safeClose();saveState(`${m.id} restored to schedule · Court ${court} at ${time}`);toast(`${m.id} added to Court ${court} at ${time}.`);
  };
  window.createScheduleMatchFromCell=function(){
    const court=selectedCourt(),time=targetTime(),division=document.getElementById('scheduleAddDivision')?.value||'',bracket=document.getElementById('scheduleAddBracket')?.value||'',teamA=document.getElementById('scheduleAddTeamA')?.value||'',teamB=document.getElementById('scheduleAddTeamB')?.value||'';
    if(!court||!time||!division||!bracket||!teamA||!teamB){toast('Choose a division, bracket and both teams.');return}if(teamA===teamB){toast('Team A and Team B must be different.');return}if(closedCourt(court)){toast(`Court ${court} is closed.`);return}
    const occ=slotAt(court,time);if(occ){toast(`Court ${court} at ${time} is already occupied by ${occ.id}.`);return}
    const a=teamMap[teamA],b=teamMap[teamB];if(!a||!b||a.division!==division||b.division!==division||a.bracket!==bracket||b.bracket!==bracket){toast('Both teams must belong to the selected division and bracket.');return}
    const duplicate=state.matches.find(m=>m.division===division&&m.bracket===bracket&&((m.teamA===teamA&&m.teamB===teamB)||(m.teamA===teamB&&m.teamB===teamA)));
    if(duplicate){toast(`That pairing already exists as ${duplicate.id}.`);return}
    const teamConflict=scheduledMatches().find(m=>m.time===time&&[teamA,teamB].some(code=>[m.teamA,m.teamB].includes(code)));
    if(teamConflict){toast(`A selected team is already scheduled at ${time} in ${teamConflict.id}.`);return}
    const id=nextPrelimId(),match={id,kind:'prelim',time,court,teamA,teamB,division,bracket,stage:'Preliminary',status:'Scheduled',scoreA:null,scoreB:null,winner:null,notes:'',scheduleModified:true,removedFromSchedule:false,manualCreated:true,createdAt:new Date().toISOString()};
    state.matches.push(match);safeClose();saveState(`${id} manually created · ${teamA} vs ${teamB} · Court ${court} at ${time}`);toast(`${id} created and added to the schedule.`);
  };


  function decorateDesktop(){
    section()?.querySelectorAll('.schedule-drop-cell').forEach(td=>{
      if(td.querySelector('.slot,.schedule-add-cell,.schedule-filtered-occupant,.schedule-closed-cell'))return;
      const court=Number(td.dataset.dropCourt),time=td.dataset.dropTime||'';if(!court||!time)return;
      const occupant=slotAt(court,time);
      if(occupant){const el=document.createElement('button');el.type='button';el.className='schedule-filtered-occupant';el.innerHTML=`<b>${esc(occupant.id)} occupies this slot</b><span>${esc(occupant.division)}</span><small>Hidden by current filter · tap to open</small>`;el.onclick=e=>{e.stopPropagation();openMatch(occupant.id)};td.appendChild(el);return}
      if(closedCourt(court)){const el=document.createElement('div');el.className='schedule-closed-cell';el.innerHTML='<b>Court closed</b><small>Reopen in Settings to schedule here</small>';td.appendChild(el);return}
      const btn=document.createElement('button');btn.type='button';btn.className='schedule-add-cell';btn.setAttribute('aria-label',`Add match to Court ${court} at ${time}`);btn.innerHTML='<i>+</i><span>Add match</span>';btn.onclick=e=>{e.stopPropagation();openScheduleCellAdd(court,time)};td.appendChild(btn);
    });
  }
  function decorateMobile(){
    section()?.querySelectorAll('.mobile-time-group').forEach(group=>{
      if(group.querySelector('.mobile-event,.mobile-add-match'))return;const label=group.querySelector('.mobile-time-label')?.textContent?.trim()||'';if(!label)return;
      const focus=Number(document.getElementById('v3FocusCourt')?.value||0),free=freeCourtsAt(label).filter(c=>!focus||c===focus);if(!free.length)return;
      const btn=document.createElement('button');btn.type='button';btn.className='mobile-add-match';btn.textContent=focus?`+ Add match · Court ${focus}`:`+ Add match at ${label}`;btn.onclick=()=>openScheduleCellAdd(focus||0,label);group.appendChild(btn);
    });
  }
  function decorate(){decorateDesktop();decorateMobile()}
  const target=section();if(target){new MutationObserver(()=>decorate()).observe(target,{childList:true,subtree:true});decorate()}
  const oldRender=window.renderScheduleOnly;if(typeof oldRender==='function')window.renderScheduleOnly=function(){oldRender();decorate()};
  try{if(section()?.classList.contains('active'))window.renderScheduleOnly?.()}catch(e){console.warn('Schedule add-cell init failed',e)}
})();
</script>

<script id="acms-v449-match-level-selector-js">
(()=>{
  const slotAt=(court,time)=>scheduledMatches().find(m=>Number(m.court)===Number(court)&&m.time===time)||null;
  const closedCourt=court=>Boolean(state.settings?.closedCourts?.[Number(court)]||state.settings?.closedCourts?.[String(court)]);
  const freeCourtsAt=time=>EVENT_COURTS.filter(c=>!slotAt(c,time)&&!closedCourt(c));
  const selectedCourt=()=>Number(document.getElementById('scheduleAddCourt')?.value||0);
  const targetTime=()=>document.getElementById('scheduleAddTime')?.value||'';
  const closeAdd=()=>document.getElementById('modalBackdrop')?.classList.remove('open');
  const selectedFilterDivision=()=>{const v=document.getElementById('scheduleDivision')?.value||'All';return v==='All'?'':v};
  const divisions=()=>[...new Set(BASE_DATA.teams.map(t=>t.division).filter(Boolean))];
  const availableBrackets=div=>[...new Set(BASE_DATA.teams.filter(t=>t.division===div).map(t=>t.bracket).filter(Boolean))].sort();
  const divisionOptions=selected=>divisions().map(d=>`<option value="${esc(d)}" ${d===selected?'selected':''}>${esc(d)}</option>`).join('');
  const teamOptions=(div,br,selected='')=>`<option value="">Select team</option>`+BASE_DATA.teams.filter(t=>t.division===div&&(!br||t.bracket===br)).map(t=>`<option value="${esc(t.code)}" ${t.code===selected?'selected':''}>${esc(t.code)} · ${esc(teamNamesText(t.code))}${br?'':' · Bracket '+esc(t.bracket)}</option>`).join('');
  const nextPrelimId=()=>{const nums=state.matches.map(m=>String(m.id||'').match(/^P(\d+)$/i)).filter(Boolean).map(m=>Number(m[1])).filter(Number.isFinite);return `P${String(Math.max(80,...nums)+1).padStart(3,'0')}`};
  const level=()=>document.getElementById('scheduleAddLevel')?.value||'prelim';
  const stageForLevel=()=>{
    const lv=level();
    if(lv==='semi')return document.getElementById('scheduleAddSemiStage')?.value||'Semifinal 1';
    if(lv==='bronze')return 'Bronze Match';
    if(lv==='gold')return 'Gold Match';
    return 'Preliminary';
  };
  const playoffSlots=(div,lv)=>{
    if(lv==='semi'){const stage=stageForLevel();return state.playoffs.filter(m=>m.division===div&&m.stage===stage);}
    const stage=lv==='bronze'?'Bronze Match':lv==='gold'?'Gold Match':'';
    return stage?state.playoffs.filter(m=>m.division===div&&m.stage===stage):[];
  };
  const eligiblePlayoffSlots=(div,lv)=>playoffSlots(div,lv).filter(m=>m.status==='Scheduled'&&!m.actualStartAt&&!m.actualEndAt);


  function levelHelp(lv){
    if(lv==='semi')return '<b>Semifinal:</b> race to 11, win by 2, no score cap. The schedule action moves an existing official semifinal slot so bracket progression stays intact.';
    if(lv==='bronze')return '<b>Bronze:</b> race to 15, win by 2, no score cap. Uses the division’s official Bronze Match slot and preserves automatic medal progression.';
    if(lv==='gold')return '<b>Gold:</b> race to 15, win by 2, no score cap. Uses the division’s official Gold Match slot and preserves automatic medal progression.';
    return '<b>Prelims:</b> race to 11, win by 2, no score cap. Creates an additional round-robin record that counts in standings and integrity checks.';
  }


  function refreshKnockoutSlotOptions(){
    const div=document.getElementById('scheduleAddDivision')?.value||'';
    const lv=level(),slotSel=document.getElementById('scheduleAddPlayoffSlot');
    if(!slotSel||lv==='prelim')return;

    slotSel.innerHTML=slots.length?slots.map(m=>`<option value="${esc(m.id)}">${esc(m.id)} · ${esc(m.stage)}${m.teamA||m.teamB?` · ${esc(teamNamesText(m.teamA))} vs ${esc(teamNamesText(m.teamB))}`:' · Teams TBD'}</option>`).join(''):'<option value="">No available official slot</option>';
    refreshKnockoutPreview();
  }


  window.refreshKnockoutPreview=function(){
    const id=document.getElementById('scheduleAddPlayoffSlot')?.value||'',m=findMatch(id),box=document.getElementById('scheduleKnockoutPreview');if(!box)return;
    if(!m){box.innerHTML='<div><small>Official slot</small><b>None available</b></div><div><small>Status</small><b>Check Playoffs / existing schedule</b></div>';return}
    box.innerHTML=`<div><small>Official slot</small><b>${esc(m.id)} · ${esc(m.stage)}</b></div><div><small>Participants</small><b>${esc(m.teamA?teamNamesText(m.teamA):'TBD')} vs ${esc(m.teamB?teamNamesText(m.teamB):'TBD')}</b></div>`;
  };


  window.refreshScheduleAddLevel=function(){
    const lv=level(),pre=document.getElementById('schedulePrelimFields'),ko=document.getElementById('scheduleKnockoutFields'),semi=document.getElementById('scheduleSemiField'),note=document.getElementById('scheduleLevelNote');
    if(pre)pre.hidden=lv!=='prelim';if(ko)ko.hidden=lv==='prelim';if(semi)semi.hidden=lv!=='semi';if(note)note.innerHTML=levelHelp(lv);

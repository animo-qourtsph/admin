    if(!brs.includes(brSel.value)&&brs.length)brSel.value=brs[0];
    const br=brSel.value||brs[0]||'',a=document.getElementById('scheduleAddTeamA'),b=document.getElementById('scheduleAddTeamB');if(a)a.innerHTML=teamOptions(div,br);if(b)b.innerHTML=teamOptions(div,br);
  };
  window.refreshScheduleAddBracketTeams=function(){
    const div=document.getElementById('scheduleAddDivision')?.value||'',br=document.getElementById('scheduleAddBracket')?.value||'',a=document.getElementById('scheduleAddTeamA'),b=document.getElementById('scheduleAddTeamB');if(a)a.innerHTML=teamOptions(div,br);if(b)b.innerHTML=teamOptions(div,br);
  };


  window.openScheduleCellAdd=function(court,time){
    court=Number(court)||0;time=String(time||'').trim();if(!time)return;
    if(court){const occupant=slotAt(court,time);if(occupant){toast(`Court ${court} at ${time} is occupied by ${occupant.id}.`);openMatch(occupant.id);return}if(closedCourt(court)){toast(`Court ${court} is closed. Reopen it in Settings before scheduling a match.`);return}}
    const free=freeCourtsAt(time);if(!court&&!free.length){toast(`No open court is available at ${time}.`);return}
    const existing=allMatches().filter(m=>m.removedFromSchedule===true&&m.status==='Scheduled'&&!m.actualStartAt).sort(scheduleSort);
    const chosenCourt=court||free[0],initialDiv=selectedFilterDivision()||BASE_DATA.teams[0]?.division||'',brackets=availableBrackets(initialDiv),initialBr=brackets[0]||'';
    const modal=document.querySelector('#modalBackdrop .modal');modal?.classList.remove('customizer-mode','player-profile-modal');
    document.getElementById('modalTitle').innerHTML=`<div class="modal-title-stack"><h2>Add Match to Schedule</h2><div class="modal-subtitle">Choose the match level, then create a prelim or place an official knockout slot.</div></div>`;
    document.getElementById('modalBody').innerHTML=`<div class="schedule-add-form">
      <input id="scheduleAddTime" type="hidden" value="${esc(time)}">
      <div class="schedule-add-target"><div><small>Scheduled time</small><b>${esc(time)}</b></div><div><small>Court</small>${court?`<b>Court ${court}</b><input id="scheduleAddCourt" type="hidden" value="${court}">`:`<select id="scheduleAddCourt">${free.map(c=>`<option value="${c}">Court ${c}</option>`).join('')}</select>`}</div></div>
      <section class="schedule-add-section"><h3>Schedule an existing unscheduled match</h3><p>Restore any previously removed preliminary or playoff record without changing its tournament level.</p>

<script id="animo-schedule-names-js">
(() => {
  const MAX_PX = 13;
  const MIN_PX = 9.75;


  function fitOne(el){
    if(!el || !el.isConnected) return;
    const slot = el.closest('.slot');
    if(!slot || slot.clientWidth <= 0) return;


    el.style.setProperty('width','90%','important');
    el.style.setProperty('max-width','90%','important');
    el.style.setProperty('white-space','nowrap','important');
    el.style.setProperty('letter-spacing','-.018em','important');


    let size = MAX_PX;
    el.style.setProperty('font-size', size + 'px', 'important');


    while(el.scrollWidth > el.clientWidth + 0.5 && size > MIN_PX){
      size = Math.max(MIN_PX, size - 0.25);
      el.style.setProperty('font-size', size + 'px', 'important');
    }
  }


  function fitScheduleNames(){
    document.querySelectorAll('#section-schedule .slot-team .player-name').forEach(fitOne);
  }


  let raf = 0;
  function queueFit(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      fitScheduleNames();
      setTimeout(fitScheduleNames, 40);
    });
  }


  document.addEventListener('DOMContentLoaded', queueFit);
  window.addEventListener('resize', queueFit, {passive:true});


  const startObserver = () => {
    const section = document.getElementById('section-schedule');
    if(!section) return;


    const mo = new MutationObserver(queueFit);
    mo.observe(section, {childList:true, subtree:true});


    if('ResizeObserver' in window){
      const ro = new ResizeObserver(queueFit);
      ro.observe(section);
    }


    queueFit();
  };


  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', startObserver, {once:true});
  }else{
    startObserver();
  }


  window.fitScheduleNames = fitScheduleNames;
})();
</script>

<script id="animo-standard-medal-seeding">
(()=>{
  function canAssign(m){return Boolean(m&&!playoffSeedLocked(m))}
  function loserOf(m,winner){if(!m||!winner)return'';return m.teamA===winner?m.teamB:m.teamB===winner?m.teamA:''}
  window.__animoAutoSeedVerifiedMedals=function(){
    const result={assigned:0,protected:[],waiting:[]};
    if(!state||!Array.isArray(state.playoffs))return result;
    for(const div of [...new Set(state.playoffs.map(m=>m.division).filter(Boolean))]){
      const semis=['Semifinal 1','Semifinal 2'].map(stage=>state.playoffs.find(m=>m.division===div&&m.stage===stage));
      const bronze=state.playoffs.find(m=>m.division===div&&m.stage==='Bronze Match');
      const gold=state.playoffs.find(m=>m.division===div&&m.stage==='Gold Match');
      if(semis.some(m=>!m)||!bronze||!gold){result.waiting.push(div);continue}
      if(semis.some(m=>!['Completed','Forfeit'].includes(m.status)||!m.resultConfirmedAt||!matchWinner(m))){result.waiting.push(div);continue}
      const winners=semis.map(matchWinner),losers=semis.map((m,i)=>loserOf(m,winners[i]));
      if(winners.some(x=>!x)||losers.some(x=>!x)||new Set([...winners,...losers]).size!==4){result.waiting.push(div);continue}
      const plans=[[gold,winners[0],winners[1]],[bronze,losers[0],losers[1]]];
      let blocked=false;
      for(const [m,a,b] of plans){
        if(m.teamA===a&&m.teamB===b)continue;
        if(!canAssign(m)){blocked=true;break}
      }
      if(blocked){result.protected.push(div);continue}
      for(const [m,a,b] of plans){
        if(m.teamA===a&&m.teamB===b)continue;
        if(!seedPlayoffPair(m,a,b)){blocked=true;break}
        result.assigned++;
      }
      if(blocked){result.protected.push(div);continue}
    }
    return result;
  };
})();
</script>

  }
  function remoteReady(cfg=publicCfg()){return Boolean(String(cfg.supabaseUrl||'').replace(/\/+$/,'')==='https://jlulpedqnhictamnfbdm.supabase.co'&&cfg.publishableKey&&cfg.publishKey)}
  function rpcUrl(cfg,name){return `${String(cfg.supabaseUrl||'').replace(/\/+$/,'')}/rest/v1/rpc/${name}`}

    for(let slot=0;slot<2;slot++){
      if(d.playerChangeModes?.[slot]!=='correction'||identityName(d.previousPlayers?.[slot])===identityName([d.p1,d.p2][slot]))continue;
      const permanentId=store[occurrenceKey(d.code,slot)]?.id,correctedName=[d.p1,d.p2][slot];
      if(!permanentId)continue;
      for(const t of BASE_DATA.teams)for(let i=0;i<(t.players?.length||0);i++){
        if(t.code===d.code&&i===slot)continue;

      }
    }

    state.registration=state.registration||{};state.registration.playerCheckin=state.registration.playerCheckin||{};state.registration.playerCheckinAt=state.registration.playerCheckinAt||{};state.registration.teamDisqualified=state.registration.teamDisqualified||{};state.registration.teamDisqualificationReason=state.registration.teamDisqualificationReason||{};state.registration.teamDisqualificationAt=state.registration.teamDisqualificationAt||{};
    state.registration.playerCheckin[d.code]=[d.checked,d.checked];
    const now=d.checked?new Date().toISOString():null;state.registration.playerCheckinAt[d.code]=d.checked?[oldAt?.[0]||now,oldAt?.[1]||now]:[null,null];
    state.registration.teamDisqualified[d.code]=oldDq;state.registration.teamDisqualificationReason[d.code]=state.registration.teamDisqualificationReason[d.code]||'';state.registration.teamDisqualificationAt[d.code]=state.registration.teamDisqualificationAt[d.code]||null;
    state.checkin[d.code]=d.checked&&!oldDq;
     state.roster=deepClone(BASE_DATA.teams);
     if(bracketChanged){
       const currentAudit=ppxBracketChangeAudit({...existing,bracket:previousBracket,code:d.code},d.bracket);
       state.settings.rosterBracketAudit=Array.isArray(state.settings.rosterBracketAudit)?state.settings.rosterBracketAudit:[];
       state.settings.rosterBracketAudit.unshift({at:new Date().toISOString(),team:d.code,from:previousBracket,to:d.bracket,unreconciledFixtures:currentAudit.incompatible.map(m=>m.id),linkedMatchCount:currentAudit.linked.length});
       state.settings.rosterBracketAudit=state.settings.rosterBracketAudit.slice(0,100);


       const div=d.division;
       if(state.settings.qualificationSnapshots)delete state.settings.qualificationSnapshots[div];
       if(state.settings.medalSnapshots)delete state.settings.medalSnapshots[div];
       if(state.settings.standingTieOverrides)for(const key of Object.keys(state.settings.standingTieOverrides))if(key.startsWith(`${div}::${previousBracket}::`)||key.startsWith(`${div}::${d.bracket}::`))delete state.settings.standingTieOverrides[key];

       if(state.settings.wildcardOverrides)delete state.settings.wildcardOverrides[div];
     }
     const resolutionText=Object.values(resolutions).map(r=>r.mode==='double-entry'?`double entry linked to ${r.sourceTeam}`:'same-name distinct identity').join(' · ');

     if(!ok){state=previousRosterState;syncRosterIntoBase(previousTeamList);for(const key of Object.keys(BASE_DATA.hospitals))delete BASE_DATA.hospitals[key];Object.assign(BASE_DATA.hospitals,previousHospitals);return false;}

  }
  const previousSaveRosterTeam=window.saveRosterTeam;

  };
  window.confirmRosterIdentityDecision=function(){

  };


  // v5.25: transactional, conservative legacy identity promotion.
  // Plan and validate first; never mutate the saved registry mid-migration.
  // A name is not proof that two registrations describe the same person.
  function upgradeRegistryBeforeCommit(){
    const existing=identityStore(),planned=deepClone(existing),occurrences=[];
    for(const t of BASE_DATA.teams)for(let slot=0;slot<Math.min(2,t.players?.length||0);slot++){
      const key=identityKey(t.code,slot),record=existing[key];
      if(!record||typeof record.id!=='string'||!record.id.trim())throw new Error(`Missing player identity at ${key}`);
      const canon=identityName(t.players[slot]);
      if(!canon)throw new Error(`Missing player name at ${key}`);
      occurrences.push({key,code:t.code,slot,name:t.players[slot],canon,record,id:record.id.trim()});
    }
    const groups=new Map(),issued=new Set(occurrences.map(r=>r.id));
    for(const r of occurrences){const g=groups.get(r.id)||[];g.push(r);groups.set(r.id,g)}
    const now=new Date().toISOString(),changes=[],seenSlots=new Set();
    const freshId=()=>{
      for(let attempt=0;attempt<8;attempt++){
        const id=newIdentityId();if(id.startsWith('pid:')&&!issued.has(id)){issued.add(id);return id}
      }
      throw new Error('Unable to generate a collision-free player ID');
    };
    function assign(r,id,mode,reason){
      if(seenSlots.has(r.key))throw new Error(`Identity assigned twice: ${r.key}`);
      seenSlots.add(r.key);
      const old=existing[r.key],next={...old,id,mode,
        sourcePlayerId:mode==='double-entry'?id:null,
        sourceTeam:null,sourceSlot:null,
        createdAt:old.createdAt||now};
      planned[r.key]=next;
      if(JSON.stringify(old)!==JSON.stringify(next))changes.push({slot:r.key,from:old.id,to:id,action:reason});
    }
    for(const [oldId,list] of groups){
      const primaries=list.filter(r=>r.record.mode!=='double-entry');
      const doubles=list.filter(r=>r.record.mode==='double-entry');
      const canonicalNames=new Set(list.map(r=>r.canon));
      const samePersonLink=primaries.length===1&&canonicalNames.size===1;
      if(samePersonLink){
        // A single primary plus explicitly identified double entries is the one
        // legacy grouping we can carry across without guessing ownership.
        const personId=oldId.startsWith('pid:')?oldId:freshId();
        const primary=primaries[0];
        assign(primary,personId,primary.record.mode==='same-name-distinct'?'same-name-distinct':'primary',oldId.startsWith('pid:')?'normalize-permanent-primary':'promote-verified-primary');
        for(const d of doubles)assign(d,personId,'double-entry','retain-verified-double-entry');

      }

        // Its unique player identity survives, but the stale link is dropped.
        const mode=r.record.mode==='same-name-distinct'?'same-name-distinct':'primary';
        assign(r,id,mode,r.record.mode==='double-entry'?'retire-orphan-link':oldId.startsWith('pid:')?'normalize-permanent-identity':'promote-single-registration');

      // Multiple different names, multiple primaries, or orphaned double entries:
      // safely stop cross-person sharing; never guess an old slot's ownership.
      // An existing permanent ID can stay with an unambiguous sole primary;
      // otherwise retire that shared ID rather than attribute historical records
      // to an arbitrarily selected person.
      const onlyPrimary=primaries.length===1?primaries[0]:null;
      const identities=new Map();
      for(const p of primaries){

        const id=keepPermanent?oldId:freshId();identities.set(p.key,id);
        assign(p,id,p.record.mode==='same-name-distinct'?'same-name-distinct':'primary',
          canonicalNames.size>1?'split-conflicting-player-names':'separate-same-name-primaries');
      }
      for(const d of doubles){
        // Preserve ONLY a double-entry link that explicitly identifies a single
        // current primary with the same normalized name and shared old ID.
        const key=d.record.sourceTeam!==null&&d.record.sourceTeam!==undefined&&Number.isInteger(Number(d.record.sourceSlot))
          ?identityKey(d.record.sourceTeam,Number(d.record.sourceSlot)):null;

      const refs=grouped.get(rec.id)||[];refs.push({...r,mode:rec.mode});grouped.set(rec.id,refs);

  }

  // Identity-aware match readiness: double entries share rest/playing state;
  // same-name distinct people do not block each other.
  matchAvailability=function(m){
    if(m?.removedFromSchedule)return{state:'unscheduled',label:'Unscheduled',details:['This match is retained in Match Control but is not assigned to the active schedule.'],readyAt:null};

    const unchecked=[m.teamA,m.teamB].filter(c=>!state.checkin?.[c]);if(unchecked.length)return{state:'checkin',label:'Check-in required',details:unchecked.map(c=>`${c} has not checked in.`),readyAt:null};

// v5.15: Supabase stores checkpoint JSON as jsonb, so object-key order is not stable.
// Compare the same meaningful Admin fields, retaining exact array ordering and values.
const resetStateFields=['roster','matches','playoffs','checkin','registration','calledMatches','settings'];
// v5.16 — Schema-aware, READ-ONLY checkpoint comparison.
// Supabase checkpoint JSON may precede a version that materializes defaults
// during Admin load. Absence and exactly the documented inactive default are
// equivalent; true values, participant rosters, results, history, and schedules
// remain strict. Neither local state nor the remote checkpoint is changed here.
const resetOptionalMatchDefaults=Object.freeze({
  timeoutActive:false,timeoutStartedAt:null,timeoutEndedAt:null,
  timeoutReason:'',timeoutHistory:[],timeoutCountA:0,timeoutCountB:0,
  actualStartAt:null,actualEndAt:null,resultRecordedAt:null,resultConfirmedAt:null,
  winner:null,scoreA:null,scoreB:null,
  notes:'',correctionReason:'',cardTitleOverride:'',cardSubtitleOverride:'',
  scheduleCardBg:'',scheduleCardFont:'',removedFromSchedule:false,
  scheduleModified:false,manualSchedulePlacement:false,manualCreated:false,
  corrections:[],rosterDetachAudit:null,scheduleMoveAudit:[],
 });
const resetSettingsDefaults=Object.freeze({
  playersPanel:true,matchDisplay:'names_code',wildcardOverrides:{},
  winnerSeedDrawOverrides:{},standingTieOverrides:{},
  qualificationSnapshots:{},medalSnapshots:{},closedCourts:{},restMinutes:20,
  forfeitPQPolicy:'exclude',tieBreakPolicy:'wr_h2h_pe_pc',playerView:{},
  adminBrand:DEFAULT_ADMIN_BRAND,sidebarStyle:DEFAULT_SIDEBAR_STYLE,
  rosterImport:{mode:'append',divisionPolicy:'existing',hospitalPolicy:'allow',checkinMode:'preserve'},
  customHospitals:{},rosterWiped:false,bulkResetAudit:[]

function resetCopyDefault(v){
  if(Array.isArray(v))return v.map(resetCopyDefault);

function resetFillMissing(raw,defaults){

  // values (including null, false, empty string) are never silently rewritten.
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return raw;

function resetComparableMatch(m){
  if(!m||typeof m!=='object'||Array.isArray(m))return m;

  // authoritative difference while a match is Scheduled. Older checkpoints may
  // omit the field while normalized local state materializes it as null.
  // Canonicalize both representations only for Scheduled matches; active or
  // completed match identity snapshots remain strict and must still match.

function resetComparableSettings(raw){
  if(raw===undefined)return resetCopyDefault(resetSettingsDefaults);

function resetComparableRegistration(raw,roster,checkin){
  if(raw!==undefined&&(!raw||typeof raw!=='object'||Array.isArray(raw)))return raw;

  // overwrite an explicitly stored identity, check-in, or adjudication.

    if(out.playerCheckin[code]===undefined)out.playerCheckin[code]=[checked,checked];
    if(out.playerCheckinAt[code]===undefined)out.playerCheckinAt[code]=[null,null];
    if(out.teamDisqualified[code]===undefined)out.teamDisqualified[code]=false;
    if(out.teamDisqualificationReason[code]===undefined)out.teamDisqualificationReason[code]='';
    if(out.teamDisqualificationAt[code]===undefined)out.teamDisqualificationAt[code]=null;
    for(let i=0;i<(team.players||[]).length;i++){
      const k=`${code}::${i}`;
      if(out.playerIdentities[k]===undefined){
        out.playerIdentities[k]={id:`legacy:${playerKey(team.players[i])}`,mode:'primary',sourceTeam:null,sourceSlot:null,createdAt:null};
      }else if(out.playerIdentities[k]&&typeof out.playerIdentities[k]==='object'&&!Array.isArray(out.playerIdentities[k])){
        const identity=out.playerIdentities[k];
        out.playerIdentities[k]=resetFillMissing(identity,{mode:'primary',sourceTeam:null,sourceSlot:null,createdAt:null});
      }
    }
  }

}
function resetStateProjection(s){
  const out={};for(const key of resetStateFields)out[key]=s?.[key];
  for(const key of ['matches','playoffs']){
    if(Array.isArray(out[key]))out[key]=out[key].map(resetComparableMatch);
  }
  out.settings=resetComparableSettings(out.settings);
  out.registration=resetComparableRegistration(out.registration,out.roster,out.checkin);
  if(out.calledMatches===undefined)out.calledMatches={};
  return out;
}
function stableJson(value){
  return JSON.stringify(value,(_key,v)=>{
    if(v===null||typeof v!=='object'||Array.isArray(v))return v;
    const sorted=Object.create(null);
    for(const key of Object.keys(v).sort())sorted[key]=v[key];
    return sorted;
  });
}
function stateSignature(s){return stableJson(resetStateProjection(s));}
// A diagnostic path is shown only after a real mismatch; never display match data or credentials.
function stateDifferencePath(left,right){
  const a=JSON.parse(stateSignature(left)),b=JSON.parse(stateSignature(right));
  function visit(x,y,path){
    if(Object.is(x,y))return null;
    if(x===null||y===null||typeof x!=='object'||typeof y!=='object')return path;
    if(Array.isArray(x)!==Array.isArray(y))return path;
    if(Array.isArray(x)){
      if(x.length!==y.length)return `${path}.length`;
      for(let i=0;i<x.length;i++){const d=visit(x[i],y[i],`${path}[${i}]`);if(d)return d;}
      return null;
    }
    const keys=[...new Set([...Object.keys(x),...Object.keys(y)])].sort();
    for(const key of keys){
      const child=/^[a-zA-Z_$][\w$]*$/.test(key)?`${path}.${key}`:`${path}[${JSON.stringify(key)}]`;
      if(!Object.hasOwn(x,key)||!Object.hasOwn(y,key))return child;
      const d=visit(x[key],y[key],child);if(d)return d;
    }
    return null;
  }
  return visit(a,b,'state')||'unknown';
}
function panel(){const p=impact('results');return `<section id="ppxResetRecovery" class="ppx-bulk-shell ppx-rr-panel">
  <div class="ppx-bulk-head"><div><div class="settings-title"><span>14</span><h3>Reset & Recovery</h3></div><p>The familiar four reset controls from Qourts tournament Admin portals. v5.16 checkpoint comparison normalizes documented inactive match, roster, and settings defaults while preserving real data differences. All changes require the active writer, a verified Supabase private checkpoint, a downloadable backup and an audit reason.</p></div><span class="ppx-bulk-secure">WRITER ONLY · BACKUP REQUIRED</span></div>
  <div class="ppx-rr-grid">
    <article class="ppx-rr-card"><div class="ppx-rr-number">01 · RESULTS</div><h4>Reset Match Results</h4><p>Clear all scores, winners, result confirmations and game timing. Retain the existing schedule and teams.</p><button class="btn danger" onclick="ppxRRReview('results')">Reset Match Results</button></article>
    <article class="ppx-rr-card"><div class="ppx-rr-number">02 · SCHEDULE</div><h4>Clear Scheduled Matches</h4><p>Remove all matches from the court timetable, including manually added matches. Keep player registrations.</p><button class="btn danger" onclick="ppxRRReview('schedule')">Clear Scheduled Matches</button></article>
    <article class="ppx-rr-card"><div class="ppx-rr-number">03 · REGISTRATIONS</div><h4>Wipe Players & Teams</h4><p>Clear registrations, matches, scores, check-ins and standings. Keep the tournament configuration.</p><button class="btn danger" onclick="ppxRRReview('roster')">Wipe Players & Teams</button></article>
    <article class="ppx-rr-card ppx-rr-strong"><div class="ppx-rr-number">04 · COMPLETE RESET</div><h4>Full Reset to Default</h4><p>Restore the original Animo teams, official schedule and settings. Current tournament data is replaced.</p><button class="btn danger" onclick="ppxRRReview('full')">Full Reset to Default</button></article>
  </div>
  <div class="ppx-bulk-note"><b>Current snapshot:</b> ${p.saved} match(es) with recorded activity · ${p.confirmed} confirmed results · ${p.scheduled} visible scheduled fixtures · ${p.roster} teams · revision ${p.rev}. Neither Supabase tables nor the private checkpoint history are deleted.</div>
</section>`}
const existingSettings=settingsSection;
settingsSection=function(){return existingSettings()+panel()};
function refreshPanel(){const page=document.getElementById('section-settings');if(page&&currentSection==='settings')page.innerHTML=settingsSection()}
function report(msg){const el=document.getElementById('ppxRRFeedback');if(el)el.textContent=msg;toast(msg.slice(0,190))}

window.ppxRRBackup=function(){
  if(!request||request.rev!==currentRev()||request.fingerprint!==stateSignature(state)){report('Tournament data changed. Reopen this reset review.');return}

  el.href=url;el.download=`Animo_PreReset_${request.action}_rev${request.rev}_${stamp}.json`;document.body.append(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);backupRevision=currentRev();
  const feedback=document.getElementById('ppxRRFeedback');if(feedback)feedback.textContent=`Backup generated for revision ${backupRevision}. Confirm the file was saved.`;

async function rpc(name,args){
  const cfg=JSON.parse(localStorage.getItem(`acms_public_sync_config_${PPX_EVENT_ID}`)||'{}');
  if(!cfg.supabaseUrl||!cfg.publishableKey||!cfg.publishKey)throw new Error('Admin Supabase credentials are missing.');
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000);
  try{const res=await fetch(`${String(cfg.supabaseUrl).replace(/\/+$/,'')}/rest/v1/rpc/${name}`,{method:'POST',signal:ctrl.signal,headers:{apikey:cfg.publishableKey,Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({...args,p_event_id:PPX_EVENT_ID,p_admin_key:cfg.publishKey})});if(!res.ok)throw new Error(`${name} returned HTTP ${res.status}`);return await res.json()}finally{clearTimeout(timer)}
}
async function verifyAuthority(p){
  if(typeof window.__ppxWriterCommitGate!=='function'||!window.__ppxWriterCommitGate())throw new Error('Only the active verified Admin writer may reset tournament data.');
  const meta=JSON.parse(localStorage.getItem(`acms_admin_failover_${PPX_EVENT_ID}`)||'{}');
  if(!meta.deviceId||!meta.serverReady)throw new Error('Layer B is not configured on this computer.');
  const lease=await rpc('ppx_admin_lease_status',{});
  if(!lease?.ok||!lease.active||lease.device_id!==meta.deviceId)throw new Error('Supabase writer lease does not belong to this device.');
  const cp=await rpc('ppx_admin_latest_checkpoint',{});
  if(!cp?.ok||!cp.found||Number(cp.revision)!==p.rev)throw new Error(`Private checkpoint not current: local ${p.rev}; remote ${cp?.revision??'unavailable'}. Checkpoint Now before trying again.`);
  if(stateSignature(cp.state)!==stateSignature(state))throw new Error(`Private checkpoint truly differs at ${stateDifferencePath(cp.state,state)}. The reset is blocked; reconcile the authoritative tournament data before proceeding.`);
}
function resetMatch(m,{unschedule=false}={}){

  m.playerIdentityAtStart=null;
  m.timeoutActive=false;m.timeoutStartedAt=null;m.timeoutEndedAt=null;m.timeoutCountA=0;m.timeoutCountB=0;m.correctionReason='';m.notes='';
  m.umpireName='';m.umpireId='';m.concurrentRowVersion=0;m.concurrentUpdatedAt=null;
  if(unschedule){m.removedFromSchedule=true;m.teamA='';m.teamB='';m.scheduleModified=false;m.manualSchedulePlacement=false;}
}
function clearDependencies(){
  state.calledMatches={};const settings=state.settings||{};
  settings.qualificationSnapshots={};settings.medalSnapshots={};settings.wildcardOverrides={};settings.winnerSeedDrawOverrides={};settings.standingTieOverrides={};

function applyAction(p,reason){

window.ppxRRExecute=async function(){
  if(executing||!request)return;
  const p=impact(request.action),btn=document.getElementById('ppxRRExecuteBtn');
  const reason=(document.getElementById('ppxRRReason')?.value||'').trim(),phrase=(document.getElementById('ppxRRPhrase')?.value||'').trim();

<script id="ppx-v522-player-identity-integrity">
(()=>{
  'use strict';
  const api=window.__ppxPlayerIdentity;
  if(!api)return;
  const norm=name=>playerKey(String(name||'').replace(/\s*\|\s*(?:NS|NO SHOW)\s*$/i,''));
  const key=(code,slot)=>`${code}::${slot}`;
  const lookup=(code,slot)=>teamMap[code]?.players?.[slot]||'';
  const activeTeam=(code)=>allMatches().some(m=>(m.teamA===code||m.teamB===code)&&['Live','Hold','Timeout','Result Pending'].includes(m.status));


  function scan(){
    const store=api.identityStore(),refs=api.occurrenceRefs(),byId=new Map();
    for(const r of refs){const members=byId.get(r.id)||[];members.push(r);byId.set(r.id,members)}
    const issues=[],repairable=[];
    for(const r of refs){
      const legacy=String(r.id||'').startsWith('legacy:')?r.id.slice(7):null;
      const differs=legacy!==null&&legacy!==norm(r.name);
      const peers=(byId.get(r.id)||[]).filter(other=>other.code!==r.code||other.slot!==r.slot);
      const conflicting=peers.filter(other=>norm(other.name)!==norm(r.name));
      const src=r.sourceTeam!==null&&r.sourceTeam!==undefined?store[key(r.sourceTeam,r.sourceSlot)]:null;
      const dangling=r.mode==='double-entry'&&(r.sourcePlayerId? r.sourcePlayerId!==r.id : (!src||src.id!==r.id||norm(lookup(r.sourceTeam,r.sourceSlot))!==norm(r.name)));
      if(differs||conflicting.length||dangling){
        const candidate=differs&&r.mode!=='double-entry'&&r.name&&norm(r.name)&&
          // Never detach a legacy identity from its only recognizable owner.
          (peers.some(p=>norm(p.name)===legacy)||peers.length===0);
        const item={...r,reason:[differs?'Legacy identity does not match roster name':null,conflicting.length?'Same identity used by different player names':null,dangling?'Double-entry source no longer matches':null].filter(Boolean).join(' · '),candidate,peers:peers.map(p=>`${p.code} Player ${p.slot+1} (${p.name})`)};
        issues.push(item);if(candidate)repairable.push(item);
      }
    }
    return{issues,repairable,checked:refs.length};
  }
  function explain(item){return `${item.code} · Player ${item.slot+1}: ${item.name}`}
  function backupRecent(){const at=state.eventMeta?.lastBackupAt||'';const elapsed=Date.now()-Date.parse(at);return Number.isFinite(elapsed)&&elapsed>=0&&elapsed<=15*60000}
  function open(){
    const result=scan();
    const safe=result.repairable;
    const other=result.issues.filter(r=>!r.candidate);
    const e=(s)=>esc(String(s??''));
    document.querySelector('#modalBackdrop .modal')?.classList.remove('customizer-mode','player-profile-modal');
    document.getElementById('modalTitle').innerHTML=`<div class="modal-title-stack"><h2>Player Identity Health</h2><div class="modal-subtitle">Read-only audit · ${result.checked} roster positions checked · ${result.issues.length} finding(s)</div></div>`;
    const renderItem=(r,repair)=>`<div class="ppx-int-entry"><div><strong>${e(explain(r))}</strong><small>${e(r.reason)}</small><small>Stored: ${e(r.id)}${r.peers.length?` · Also attached to ${e(r.peers.join(', '))}`:''}</small></div></div>`;
    document.getElementById('modalBody').innerHTML=`<div class="ppx-int-audit">
      <div class="ppx-int-lead"><strong>${result.issues.length?`${result.issues.length} identity integrity finding(s)`:'No mismatched identities detected'}</strong><p>Matching names and player identities prevents false Playing statuses. This audit does not change scores or matches. Identities are automatically validated during authorized saves; no routine manual repair is needed.</p></div>
      ${safe.length?`<div class="ppx-int-group"><h3>Legacy identity requiring automatic upgrade on next authorized save (${safe.length})</h3>${safe.map(r=>renderItem(r,true)).join('')}</div>`:''}
      ${other.length?`<div class="ppx-int-group"><h3>Review exceptional identity ambiguities (${other.length})</h3>${other.map(r=>renderItem(r,false)).join('')}</div>`:''}
      ${!result.issues.length?'<div class="ppx-int-empty ppx-int-good">✓ All current roster identities are internally consistent.</div>':''}
      <div class="ppx-int-warning">Automatic identity upgrades occur only as part of an authorized Admin save. Existing match scores and opponents are preserved. Back up the event before deploying upgrades.</div>
      <div class="ppx-int-footer"><button class="btn" onclick="document.getElementById('modalBackdrop').classList.remove('open')">Close</button><button class="btn" onclick="ppxOpenIdentityIntegrity()">Recheck</button></div>
    </div>`;
    document.getElementById('modalBackdrop').classList.add('open');
  }
  function repair(code,slot){
    const current=scan().repairable.find(r=>r.code===code&&r.slot===slot);
    if(!current){toast('No safe repair for this roster position. Refresh the Identity Audit.');open();return false}
    if(activeTeam(code)){toast(`${code} has an active/pending match. Finish or correct it before changing its identity.`);return false}
    const affected=api.occurrenceRefs().filter(r=>r.id===current.id);
    if(affected.some(r=>activeTeam(r.code))){toast('A linked identity has an active or pending match. Repair deferred until it is resolved.');return false}
    if(!backupRecent()){toast('Export a fresh JSON backup in Settings before repairing a player identity.');return false}
    if(typeof window.__ppxWriterCommitGate==='function'&&!window.__ppxWriterCommitGate())return false;
    const before=JSON.parse(JSON.stringify(api.identityStore()));
    const previous=before[key(code,slot)];
    if(!previous||previous.id!==current.id){toast('Roster identity changed. Re-run the audit.');return false}
    const others=affected.filter(r=>r.code!==code||r.slot!==slot);
    const summary=`Fix ${explain(current)}?\n\nReplace incorrect ID ${current.id} with a new unique player ID. ${others.length?`Revalidate ${others.length} linked occurrence(s). `:''}Match results and scheduled opponents will not change. This action is logged.`;
    if(!confirm(summary))return false;
    const store=api.identityStore();
    const random=()=>`pid:${typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`}`;
    store[key(code,slot)]={id:random(),mode:'primary',sourceTeam:null,sourceSlot:null,createdAt:new Date().toISOString()};
    let detached=0;
    for(const other of others){
      const k=key(other.code,other.slot),rec=store[k];
      if(rec?.id===current.id&&rec.mode==='double-entry'&&rec.sourceTeam===code&&Number(rec.sourceSlot)===slot){

    }

    let ok=false;
    try{ok=Boolean(saveState(msg))}catch(err){console.error('Identity repair commit failed',err)}
    if(!ok){state.registration.playerIdentities=before;toast('Identity repair did not commit; restored the previous identity registry.');return false}

  }

  window.ppxOpenIdentityIntegrity=open;
  // Manual identity repair is superseded by automatic transactional identity reconciliation.
  // Strengthen production preflight. Read-only scan: no opportunistic repair on load.
  const original=window.__acmsProductionPreflightChecks;

    return rows;
  };
})();
</script>

<script id="ppx-v524-read-only-backup">
(()=>{
  'use strict';
  const EXPORT_MARKER='ANIMO_2026_READ_ONLY_BACKUP_INITIATED_v1';
  function safeNotice(msg){try{toast(msg)}catch(_){console.info(msg)}}
  function readBackupSource(){
    // A backup MUST NOT call commitState(): that function modifies revisions,
    // seeds playoff records, migrates player IDs and schedules remote publishes.
    const raw=localStorage.getItem(STORAGE);
    if(!raw)throw new Error('No saved primary tournament state exists in this browser.');
    const parsed=safeStateObject(JSON.parse(raw));
    if(parsed.eventMeta?.eventId!==PPX_EVENT_ID)throw new Error('Saved event ID does not match this tournament.');
    if(!Array.isArray(parsed.roster)||!Array.isArray(parsed.matches)||!Array.isArray(parsed.playoffs))throw new Error('Saved roster or match arrays are missing.');
    const revision=Number(parsed.eventMeta?.localRevision);
    if(!Number.isSafeInteger(revision)||revision<0)throw new Error('Saved tournament revision is invalid.');
    const runtimeRevision=Number(state.eventMeta?.localRevision)||0;
    return {raw,revision,runtimeRevision,teams:parsed.roster.length,matches:parsed.matches.length+parsed.playoffs.length};
  }
  function initiateDownload(raw,filename){
    const url=URL.createObjectURL(new Blob([raw],{type:'application/json;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=filename;a.hidden=true;document.body.appendChild(a);
    try{a.click()}finally{a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
  }
  function exportReadOnlyBackup(){
    let data;
    try{data=readBackupSource()}catch(e){
      console.error('Read-only backup: primary local state unavailable or invalid',e);
      alert(`Backup could not be verified from local browser storage.\n\n${String(e?.message||e)}\n\nNo tournament data was changed. Do not reset, recover, or clear browser storage. Keep this browser open and contact Qourts support.`);
      return false;
    }
    const at=new Date().toISOString(), stamp=at.replace(/[:.]/g,'-'),filename=`Animo_Pickleball_Cup_Primary_ReadOnly_r${data.revision}_${stamp}.json`;
    try{
      initiateDownload(data.raw,filename);
      // Optional small session-only note. Failure must not block the backup.
      try{sessionStorage.setItem(EXPORT_MARKER,JSON.stringify({at,revision:data.revision,filename}))}catch(_){}
      const mismatch=data.revision!==data.runtimeRevision;
      const summary=`Backup download initiated: ${filename}\n\nSource: verified saved browser state, revision ${data.revision}\nRoster: ${data.teams} teams · Matches: ${data.matches}\n\nThis read-only export did NOT save, migrate identities, publish, or change tournament revision.\n\n${mismatch?`WARNING: the in-memory revision is ${data.runtimeRevision}, different from saved revision ${data.revision}. This export contains the saved revision only.\n\n`:''}IMPORTANT: Check your Downloads folder and verify that the JSON file exists before relying on it.`;
      safeNotice('Read-only backup download started. Check the downloaded JSON file. No tournament records changed.');
      alert(summary);
      return true;
    }catch(e){
      console.error('Read-only backup download could not start',e);
      alert(`Could not start the backup download: ${String(e?.message||e)}\n\nNo tournament records were changed.`);
      return false;
    }
  }

  window.exportData=exportReadOnlyBackup;
  window.__ppxReadOnlyBackup={readBackupSource,exportReadOnlyBackup};
  // Replace the old false 'no backup' verdict. A browser cannot confirm that a
  // download was ultimately retained, so an initiated download is a WARNING,
  // never a passed/verified external backup.
  const earlier=window.__acmsProductionPreflightChecks;
  if(typeof earlier==='function')window.__acmsProductionPreflightChecks=function(){
    const checks=earlier();
    let marker=null;
    try{marker=JSON.parse(sessionStorage.getItem(EXPORT_MARKER)||'null')}catch(_){}

      const old=checks.find(c=>c.title==='Backup freshness');
      if(old){old.severity='warn';old.detail=`Read-only backup download initiated at ${fmtDateTime(marker.at)} for revision ${marker.revision}. Verify the downloaded file in Downloads; no tournament write or identity migration was required.`}
    }

  };
})();

<script id="ppx-v526-player-id-system">

    let conflicting=0,shared=0;for(const [id,list] of groups){if(!id)continue;if(list.length>1){shared++;if(new Set(list.map(r=>r.canon)).size>1)conflicting++}}

  }

<script id="animo-v11-visual-runtime">
(() => {
  'use strict';


  const teamName = code => {
    const t = typeof teamMap !== 'undefined' ? teamMap[code] : null;
    if (t?.players?.length) return t.players.join(' / ');
    return code || 'TBD';
  };
  const shortReason = (m,a) => {
    if (!a) return '';
    if (a.state === 'checkin') {
      const unchecked=[m.teamA,m.teamB].filter(c=>c && !state.checkin?.[c]);
      return unchecked.length ? `${unchecked.join(', ')} not checked in` : 'Player check-in required';
    }
    if (a.state === 'resting') return a.details?.[0] || 'Player rest window active';
    if (a.state === 'playing') return a.details?.[0] || 'Player currently on another court';
    if (a.state === 'court-busy') return a.details?.[0] || 'Court is occupied';
    return a.details?.[0] || a.label || '';
  };


  function animoCourtBoard(){
    const floor=floorSnapshot();
    return `<div class="animo-court-grid">${floor.map(x=>{
      const m=x.m;
      if(!m){
        return `<button type="button" class="animo-court-tile open" onclick="setSection('schedule')"><div class="animo-court-top"><span class="animo-court-no">COURT ${x.court}</span><span class="animo-court-state">FREE</span></div><div class="animo-court-meta"><b>Available</b><span>No active assignment</span></div><div class="animo-court-teams"><div class="animo-court-team"><b>Ready for next callable match</b><strong>—</strong></div></div><div class="animo-court-foot">Open schedule to review the next assignment.</div></button>`;
      }

      const label=m.status==='Live'?'LIVE':m.status==='Hold'?'HOLD':m.status==='Result Pending'?'RESULT PENDING':a?.state==='ready'?'READY':(a?.label||m.status||'QUEUED');

      return `<button type="button" class="animo-court-tile ${cls}" onclick="openMatch('${esc(m.id)}')"><div class="animo-court-top"><span class="animo-court-no">COURT ${x.court}</span><span class="animo-court-state">${esc(label)}</span></div><div class="animo-court-meta"><b>${esc(m.id)}</b><span>${esc(m.time)} · ${esc(m.division)} · ${esc(m.stage)}</span></div><div class="animo-court-teams"><div class="animo-court-team"><b>${esc(teamName(m.teamA))}</b><strong>${scoreA}</strong></div><div class="animo-court-team"><b>${esc(teamName(m.teamB))}</b><strong>${scoreB}</strong></div></div><div class="animo-court-foot">${esc(foot)}</div></button>`;
    }).join('')}</div>`;
  }


  dashboard = function(){

<script id="animo-preflight-filter-v1-8">
(() => {
  'use strict';


  let activeFilter = null;


  const normalizeFilter = value => ['pass','warn','fail'].includes(value) ? value : null;
  const filterLabel = value => value === 'pass' ? 'Pass' : value === 'warn' ? 'Warnings' : value === 'fail' ? 'Blockers' : 'All checks';


  function getChecks(){
    try{
      if(typeof window.__acmsProductionPreflightChecks === 'function') return window.__acmsProductionPreflightChecks();
      if(typeof window.__acmsBasePreflightChecks === 'function') return window.__acmsBasePreflightChecks();
    }catch(err){
      console.error('Animo preflight check collection failed', err);
    }
    return [];
  }


  function renderHealth(){
    const checks = getChecks();
    const pass = checks.filter(x => x.severity === 'pass').length;
    const warn = checks.filter(x => x.severity === 'warn').length;
    const fail = checks.filter(x => x.severity === 'fail').length;
    const filter = normalizeFilter(activeFilter);
    const visible = filter ? checks.filter(x => x.severity === filter) : checks;
    const pressed = value => filter === value ? 'true' : 'false';
    const hint = value => filter === value ? 'Active · click to show all' : 'Click to filter';
    const summary = filter
      ? `<div class="preflight-filter-summary"><span>Showing <b>${esc(filterLabel(filter))}</b> only · ${visible.length} check${visible.length===1?'':'s'}</span><button class="preflight-filter-clear" type="button" onclick="setPreflightFilter(null)">Show all</button></div>`
      : `<div class="preflight-filter-summary"><span>Showing <b>all checks</b> · click a summary card to filter.</span></div>`;
    const list = visible.length
      ? visible.map(x=>`<div class="preflight-item ${x.severity==='pass'?'':x.severity}"><i></i><div><b>${esc(x.title)}</b><span>${esc(x.detail)}</span></div><em>${x.severity}</em></div>`).join('')
      : `<div class="preflight-empty">No ${esc(filterLabel(filter).toLowerCase())} checks to show.</div>`;


    return `<div class="section-head"><div><div class="eyebrow">TOURNAMENT SAFETY</div><h1>Preflight & Health</h1><p>Production checks for roster, schedule, courts, standings dependencies, results, public sync, clock and backups.</p></div><div class="head-actions"><button class="btn" onclick="exportData()">Export Backup Now</button><button class="btn primary" onclick="document.getElementById('section-health').innerHTML=healthSection()">Run Checks</button></div></div>
      <div class="preflight-grid" role="group" aria-label="Filter preflight checks by status">
        <button class="preflight-stat" type="button" data-filter="pass" aria-pressed="${pressed('pass')}" onclick="setPreflightFilter('pass')"><small>PASS</small><strong>${pass}</strong><span class="preflight-stat-filter-hint">${hint('pass')}</span></button>
        <button class="preflight-stat" type="button" data-filter="warn" aria-pressed="${pressed('warn')}" onclick="setPreflightFilter('warn')"><small>WARNINGS</small><strong>${warn}</strong><span class="preflight-stat-filter-hint">${hint('warn')}</span></button>
        <button class="preflight-stat" type="button" data-filter="fail" aria-pressed="${pressed('fail')}" onclick="setPreflightFilter('fail')"><small>BLOCKERS</small><strong>${fail}</strong><span class="preflight-stat-filter-hint">${hint('fail')}</span></button>
      </div>
      <div class="preflight-rule"><b>Rules currently enforced:</b> bracket ranking = Win Rate → exactly 2 tied: Head-to-Head; 3+ tied: highest PE → lowest PC → manual review if still exact. Scoreless preliminary forfeits = ${state.settings.forfeitPQPolicy==='target_zero'?'11–0 for PE/PC':'excluded from PE/PC while still counting W/L'}. Actual start/end use this device clock.</div>
      ${summary}
      <div class="preflight-list">${list}</div>`;
  }


  window.setPreflightFilter = function(value){
    const next = normalizeFilter(value);
    activeFilter = next && activeFilter === next ? null : next;
    const section = document.getElementById('section-health');
    if(section) section.innerHTML = renderHealth();
  };


  window.healthSection = renderHealth;


  // If the section was already created by an earlier layer, refresh its cached markup once.
  const existing = document.getElementById('section-health');
  if(existing) existing.innerHTML = renderHealth();
})();
</script>

<script id="animo-device-typography-settings">
(function(){
  const KEY=(window.__animoDeviceTypographyBootstrap&&window.__animoDeviceTypographyBootstrap.key)||'animo_match_control_device_typography_v1';
  const DEFAULTS=Object.freeze({scale:1,weightShift:0});
  const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
  const copy=v=>({scale:v.scale,weightShift:v.weightShift});


  function read(){
    try{
      const raw=JSON.parse(localStorage.getItem(KEY)||'null');
      if(!raw||typeof raw!=='object')return copy(DEFAULTS);
      return {
        scale:clamp(Number(raw.scale)||1,.85,1.25),
        weightShift:clamp(Number(raw.weightShift)||0,-100,100)
      };
    }catch(_e){return copy(DEFAULTS)}
  }
  function apply(cfg){
    const safe={
      scale:clamp(Number(cfg?.scale)||1,.85,1.25),
      weightShift:clamp(Number(cfg?.weightShift)||0,-100,100)
    };
    document.documentElement.style.setProperty('--animo-device-font-scale',String(safe.scale));
    document.documentElement.style.setProperty('--animo-device-font-weight-shift',String(safe.weightShift));
    const out=document.getElementById('deviceFontScaleValue');
    if(out)out.textContent=`${Math.round(safe.scale*100)}%`;
    const scale=document.getElementById('deviceFontScale');
    if(scale)scale.value=String(Math.round(safe.scale*100));
    const weight=document.getElementById('deviceFontWeight');
    if(weight)weight.value=String(safe.weightShift);
    return safe;
  }
  function labelWeight(v){
    const n=Number(v)||0;
    return n<=-75?'Lighter':n<25?'Standard':n<75?'Medium':'Strong';
  }
  window.previewDeviceTypography=function(){
    const scale=clamp((Number(document.getElementById('deviceFontScale')?.value)||100)/100,.85,1.25);
    const weightShift=clamp(Number(document.getElementById('deviceFontWeight')?.value)||0,-100,100);
    const cfg=apply({scale,weightShift});
    const badge=document.getElementById('deviceFontWeightValue');
    if(badge)badge.textContent=labelWeight(cfg.weightShift);
  };
  window.saveDeviceTypography=function(){
    const scale=clamp((Number(document.getElementById('deviceFontScale')?.value)||100)/100,.85,1.25);
    const weightShift=clamp(Number(document.getElementById('deviceFontWeight')?.value)||0,-100,100);
    const cfg=apply({scale,weightShift});
    try{localStorage.setItem(KEY,JSON.stringify(cfg));}catch(_e){}
    if(typeof toast==='function')toast('Typography saved on this device only.');
  };
  window.resetDeviceTypography=function(){
    try{localStorage.removeItem(KEY);}catch(_e){}
    apply(DEFAULTS);
    const badge=document.getElementById('deviceFontWeightValue');
    if(badge)badge.textContent='Standard';
    if(typeof toast==='function')toast('Device typography restored to default.');
  };


  function card(){
    const cfg=read();
    const percent=Math.round(cfg.scale*100);
    return `<div class="card settings-card device-type-card">
      <div class="settings-title"><span>Aa</span><h3>Device Typography</h3></div>
      <div class="device-type-note"><span class="device-type-icon">Aa</span><div><b>Local to this device</b><div>This changes only the Admin interface in this browser. It is not synced to Supabase, not included in tournament backups, and does not change Player or Umpire displays.</div></div></div>
      <div class="device-type-layout">
        <div class="device-type-controls">
          <div class="device-type-control">
            <div class="device-type-control-head"><b>Interface text size</b><span id="deviceFontScaleValue">${percent}%</span></div>
            <div class="device-type-range"><small>Smaller</small><input id="deviceFontScale" type="range" min="85" max="125" step="5" value="${percent}" oninput="previewDeviceTypography()"><small>Larger</small></div>
          </div>
          <div class="device-type-control">
            <div class="device-type-control-head"><b>Text weight</b><span id="deviceFontWeightValue">${labelWeight(cfg.weightShift)}</span></div>
            <select id="deviceFontWeight" onchange="previewDeviceTypography()">
              <option value="-100" ${cfg.weightShift===-100?'selected':''}>Lighter</option>
              <option value="0" ${cfg.weightShift===0?'selected':''}>Standard</option>
              <option value="50" ${cfg.weightShift===50?'selected':''}>Medium</option>
              <option value="100" ${cfg.weightShift===100?'selected':''}>Strong</option>
            </select>
          </div>
        </div>
        <div class="device-type-preview" aria-label="Typography preview">
          <small>Live preview</small>
          <strong>Animo Match Control</strong>
          <p>Joshua Flores / Arian Alcantara · Court 15 · 11:20 AM</p>
          <div class="device-type-preview-meta"><span>AM-A1</span><span>Ready</span><span>4 matches</span></div>
        </div>
      </div>
      <div class="device-type-actions"><button class="btn" type="button" onclick="resetDeviceTypography()">Restore on this device</button><button class="btn primary" type="button" onclick="saveDeviceTypography()">Save on this device</button></div>
    </div>`;
  }


  if(typeof settingsSection==='function'){
    const prior=settingsSection;
    settingsSection=function(){
      const html=prior();
      const floor='<div class="card settings-card"><div class="settings-title"><span>04</span><h3>Floor Rules</h3>';
      return html.includes(floor)?html.replace(floor,card()+floor):html+card();
    };
  }


  // Reapply saved values after all scripts have loaded.
  apply(read());
})();
</script>

<script id="animo-admin-v122-cmo-locator">
(() => {
  'use strict';


  function addCMOLocator(){
    const page=document.getElementById('section-settings');
    if(!page||!page.classList.contains('active'))return;
    const head=page.querySelector('.section-head');
    if(!head||head.querySelector('[data-cmo-locator]'))return;
    const actions=document.createElement('div');
    actions.className='head-actions';
    actions.innerHTML='<button class="btn primary" type="button" data-cmo-locator>Concurrent Match Ops</button>';
    head.appendChild(actions);
    actions.querySelector('[data-cmo-locator]')?.addEventListener('click',()=>{
      const card=page.querySelector('.ppx-cmo-card');
      if(card){
        card.scrollIntoView({behavior:'smooth',block:'start'});
        card.animate(
          [{boxShadow:'0 0 0 0 rgba(14,122,56,0)'},{boxShadow:'0 0 0 5px rgba(14,122,56,.18)'},{boxShadow:'0 0 0 0 rgba(14,122,56,0)'}],
          {duration:1100,easing:'ease-out'}
        );
      }
    });
  }


  const observer=new MutationObserver(()=>addCMOLocator());
  observer.observe(document.body,{subtree:true,childList:true});
  document.addEventListener('click',()=>setTimeout(addCMOLocator,0),true);
  setTimeout(addCMOLocator,0);
})();
</script>

<!-- Animo Admin v1.24.2 — wait for private checkpoint acknowledgement after destructive reset -->
<script id="animo-admin-v1242-checkpoint-ack-wait">
(function(){
  const EVENT_ID='ANIMO-PICKLEBALL-CUP-2026';
  const prior=window.syncAdminCheckpointNow;
  if(typeof prior!=='function')return;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  function currentRevision(){return Number(window.state?.eventMeta?.localRevision ?? (typeof state!=='undefined'?state?.eventMeta?.localRevision:0))||0}
  async function latestPrivateCheckpoint(){
    const cfg=JSON.parse(localStorage.getItem(`acms_public_sync_config_${EVENT_ID}`)||'{}');
    if(!cfg.supabaseUrl||!cfg.publishableKey||!cfg.publishKey)throw new Error('Admin Supabase credentials are missing.');
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000);
    try{
      const res=await fetch(`${String(cfg.supabaseUrl).replace(/\/+$/,'')}/rest/v1/rpc/ppx_admin_latest_checkpoint`,{
        method:'POST',signal:ctrl.signal,
        headers:{apikey:cfg.publishableKey,Accept:'application/json','Content-Type':'application/json'},
        body:JSON.stringify({p_event_id:EVENT_ID,p_admin_key:cfg.publishKey})
      });
      if(!res.ok)throw new Error(`ppx_admin_latest_checkpoint returned HTTP ${res.status}`);
      return await res.json();
    } finally { clearTimeout(timer) }
  }
  window.syncAdminCheckpointNow=async function(){
    const target=currentRevision();
    await prior.apply(this,arguments);
    const deadline=Date.now()+15000;
    let retried=false,last=null;
    while(Date.now()<deadline){
      try{
        last=await latestPrivateCheckpoint();
        if(last?.ok&&last?.found&&Number(last.revision)===target)return last;
      }catch(_e){}
      if(!retried&&Date.now()>deadline-11000){
        retried=true;
        try{await prior.apply(this,arguments)}catch(_e){}
      }
      await sleep(500);
    }
    return last||{ok:false,found:false,revision:null};
  };
})();
</script>

<script id="animo-admin-v1244-authoritative-admin-results">
/* v1.24.4 — Admin-entered final results are authoritative.
   Existing Admin-only Completed/Forfeit results without confirmation are upgraded once.
   The existing progression engine then seeds semifinals/medal matches atomically. */
(function(){
  let attempts=0;
  function isAdminOnlyFinal(m){
    if(!m||!['Completed','Forfeit'].includes(m.status)||m.resultConfirmedAt)return false;
    if(!m.winner)return false;
    if(m.status==='Completed'&&(!Number.isInteger(m.scoreA)||!Number.isInteger(m.scoreB)))return false;
    const hasOperator=Boolean(String(m.umpireId||'').trim()||String(m.umpireName||'').trim());
    return !hasOperator;
  }
  function upgrade(){
    attempts++;
    try{
      if(typeof state==='undefined'||typeof allMatches!=='function'||typeof commitState!=='function')throw new Error('Admin state not ready');
      if(typeof window.__ppxWriterCommitGate==='function'&&window.__ppxWriterCommitGate({silent:true})===false){
        if(attempts<20)setTimeout(upgrade,1500);
        return;
      }
      const rows=allMatches().filter(isAdminOnlyFinal);
      if(!rows.length)return;
      const now=new Date().toISOString();
      for(const m of rows)m.resultConfirmedAt=m.resultRecordedAt||m.actualEndAt||now;
      const ok=commitState(`Admin authority upgrade · ${rows.length} existing final result${rows.length===1?'':'s'} confirmed automatically`,{render:false});
      if(ok){
        try{renderAll()}catch(e){}
        try{toast(`${rows.length} Admin-entered final result${rows.length===1?'':'s'} confirmed · playoff progression updated automatically.`)}catch(e){}
      }
    }catch(e){
      if(attempts<20)setTimeout(upgrade,1500);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(upgrade,1200),{once:true});
  else setTimeout(upgrade,1200);
})();
</script>


<script id="animo-admin-v1245-progression-fix">
/* v1.24.5 — semifinal + medal auto-progression repair. */
(function(){
  window.ANIMO_ADMIN_RELEASE='v1.24.5-progression-fix';
  function samePair(m,p){return Boolean(m&&p&&((m.teamA===p.a&&m.teamB===p.b)||(m.teamA===p.b&&m.teamB===p.a)))}
  window.__animoProgressionHealth=function(){
    const issues=[];
    try{
      const divisions=[...new Set((state?.playoffs||[]).map(m=>m.division).filter(Boolean))];
      for(const div of divisions){
        const q=qualificationForDivision(div);
        const semis=['Semifinal 1','Semifinal 2'].map(stage=>state.playoffs.find(m=>m.division===div&&m.stage===stage));
        if(q?.ready&&officialPrelimsConfirmed(div)&&q.pairings?.length===2){
          semis.forEach((m,i)=>{if(m&&!samePair(m,q.pairings[i]))issues.push({division:div,stage:m.stage,type:playoffSeedLocked(m)?'protected-semifinal-mismatch':'seedable-semifinal-missing'})});
        }
        const finalizedSemis=semis.length===2&&semis.every(m=>m&&['Completed','Forfeit'].includes(m.status)&&m.resultConfirmedAt&&matchWinner(m));
        if(finalizedSemis){
          const winners=semis.map(matchWinner);
          const losers=semis.map((m,i)=>m.teamA===winners[i]?m.teamB:m.teamA);
          const plans=[['Gold Match',winners[0],winners[1]],['Bronze Match',losers[0],losers[1]]];
          for(const [stage,a,b] of plans){
            const m=state.playoffs.find(x=>x.division===div&&x.stage===stage);
            if(m&&(m.teamA!==a||m.teamB!==b))issues.push({division:div,stage,type:playoffSeedLocked(m)?'protected-medal-mismatch':'seedable-medal-missing'});
          }
        }
      }
    }catch(e){issues.push({type:'health-check-error',message:String(e?.message||e)})}
    return issues;
  };
  let attempts=0;
  function repair(){
    attempts++;
    try{
      if(typeof state==='undefined'||typeof commitState!=='function'||typeof ppxAutoSeedConfirmedSemifinals!=='function')throw new Error('progression engine not ready');
      if(typeof window.__ppxWriterCommitGate==='function'&&window.__ppxWriterCommitGate({silent:true})===false){if(attempts<20)setTimeout(repair,1200);return}
      const issues=window.__animoProgressionHealth();
      const seedable=issues.filter(x=>String(x.type||'').startsWith('seedable-'));
      if(!seedable.length)return;
      const ok=commitState(`Progression repair · ${seedable.length} clean playoff slot${seedable.length===1?'':'s'} populated from authoritative results`,{render:false});
      if(ok){try{renderAll()}catch(e){};try{toast('Semifinal / medal progression repaired from authoritative results.')}catch(e){}}
    }catch(e){if(attempts<20)setTimeout(repair,1200)}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(repair,900),{once:true});
  else setTimeout(repair,900);
})();
</script>

  function overview(){const teams=integratedFilteredTeams(false),all=BASE_DATA.teams,slots=all.reduce((n,t)=>n+(t.players||[]).filter(p=>p&&clean(p)!=='tbd').length,0),present=all.reduce((n,t)=>n+(reg().playerCheckin[t.code]||[]).filter(Boolean).length,0);const linked=[];for(const t of all)for(const p of t.players||[]){const row=jerseyFor(t,p);if(row)linked.push(row)}const linkedKeys=new Set(linked.map(claimKey)),claimedCount=[...linkedKeys].filter(k=>reg().jerseyClaims[k]?.claimed).length;const noJersey=all.flatMap(t=>(t.players||[]).map((p,i)=>({t,p,i,row:jerseyFor(t,p)}))).filter(x=>x.p&&clean(x.p)!=='tbd'&&!x.row);const unlinked=jerseyRows().filter(r=>!all.some(t=>(t.players||[]).some(p=>canonName(p)===canonName(r.player)&&canonDiv(t.division)===canonDiv(r.division))));const ready=all.filter(t=>statusFor(t).key==='ready').length;return`<div class="checkin-jersey-overview"><div class="cj-summary-card"><div class="cj-summary-title"><div><b>Event-Day Check-In & Jersey Release</b><small>One action checks the player in and records the jersey as claimed.</small></div></div><div class="cj-meter-grid"><div class="cj-meter"><span>Players checked in</span><strong>${present}/${slots}</strong><small>${slots?Math.round(present/slots*100):0}% attendance</small></div><div class="cj-meter"><span>Teams ready</span><strong>${ready}/${all.length}</strong><small>Both players checked in</small></div><div class="cj-meter"><span>Linked jerseys released</span><strong>${claimedCount}/${linkedKeys.size}</strong><small>${linkedKeys.size?Math.round(claimedCount/linkedKeys.size*100):0}% released</small></div><div class="cj-meter"><span>Jersey reference records</span><strong>${jerseyRows().length}</strong><small>${unlinked.length} not linked to current roster</small></div></div><div class="cj-toolbar"><button class="btn" onclick="exportRosterCheckin()">Export Check-In</button><button class="btn" onclick="exportJerseyClaims()">Export Jersey Claims</button></div></div><div class="cj-summary-card"><div class="cj-summary-title"><div><b>Exceptions</b><small>Resolve these before the registration desk gets busy.</small></div></div>${noJersey.length||unlinked.length?`<div class="cj-alert"><span>!</span><div><b>${noJersey.length} roster player${noJersey.length===1?'':'s'} without a linked jersey record</b>${noJersey.slice(0,4).map(x=>`${esc(x.p)} · ${esc(x.t.code)}`).join('<br>')}${noJersey.length>4?`<br>+${noJersey.length-4} more`:''}${unlinked.length?`<br><br>${unlinked.length} jersey record${unlinked.length===1?' is':'s are'} not linked to the current roster: ${unlinked.slice(0,3).map(x=>esc(x.player)).join(', ')}${unlinked.length>3?'…':''}`:''}</div></div>`:`<div class="cj-alert" style="background:#eef9f2;border-color:#cbe8d5;color:#24613f"><span>✓</span><div><b>All jersey records are linked</b>No roster/jersey exceptions detected.</div></div>`}</div></div>`}
  function playerHtml(team,p,i,a){const row=jerseyFor(team,p),isChecked=Boolean(a[i]),isClaimed=claimed(row),missing=!p||clean(p)==='tbd';let action='';if(missing)action=`<button class="cj-primary attn" onclick="openRosterEditor('${esc(team.code)}')">Add Player</button>`;else if(!isChecked&&!isClaimed)action=`<button class="cj-primary" onclick="checkInAndGiveJersey('${esc(team.code)}',${i})">${row?'Check In + Give Jersey':'Check In'}</button>`;else if(!isChecked&&isClaimed)action=`<button class="cj-primary" onclick="checkInAndGiveJersey('${esc(team.code)}',${i})">Check In</button>`;else if(isChecked&&!isClaimed)action=`<button class="cj-primary attn" onclick="giveJerseyOnly('${esc(team.code)}',${i})">${row?'Give Jersey':'No Jersey Record'}</button>`;else action=`<button class="cj-primary done" disabled>✓ Checked In + Jersey</button>`;return`<div class="cj-player"><div class="cj-player-main"><div class="cj-player-name"><span class="cj-status-dot ${isChecked?'on':''}"></span><b>${missing?'Missing player':esc(p)}</b></div><div class="cj-jersey-meta">${row?`<span class="cj-size">${esc(row.size)}</span><span class="cj-back">Back: ${esc(row.backName)}</span><span class="cj-ref">${esc(row.reference)}</span>${isClaimed?`<span class="cj-claim-state">Claimed</span>`:`<span class="cj-claim-state pending">Unclaimed</span>`}`:`<span class="cj-no-jersey">No jersey record</span>`}</div></div><div class="cj-player-actions">${action}${isChecked?`<button class="cj-secondary" onclick="undoCheckinKeepJersey('${esc(team.code)}',${i})">Undo check-in</button>`:''}${row&&isClaimed?`<button class="cj-secondary" onclick="undoJerseyFromCheckin('${esc(team.code)}',${i})">Undo jersey claim</button>`:''}</div></div>`}
  function cards(){const teams=integratedFilteredTeams(true);return teams.map(t=>{const s=statusFor(t),a=s.a;while(a.length<2)a.push(false);const rows=(t.players||['','']).slice(0,2).map((p,i)=>playerHtml(t,p,i,a)).join('');const linked=(t.players||[]).slice(0,2).map(p=>jerseyFor(t,p));const allClaimed=linked.every((r,i)=>!t.players?.[i]||clean(t.players[i])==='tbd'||(r&&claimed(r)));const teamDone=s.n===2&&allClaimed;return`<article class="regops-checkin-card cj-card ${s.key==='ready'?'is-ready':s.key==='partial'?'is-partial':s.key==='waiting'?'is-waiting':s.dq?'is-dq':'is-incomplete'}"><div class="regops-checkin-card-head"><div class="team-id"><b>${esc(t.code)}</b><span class="regops-sub">${esc(t.division)} · Bracket ${esc(t.bracket||'—')}</span></div><span class="regops-card-state ${s.dq?'danger':teamDone?'success':s.n?'attention':'muted'}">${s.dq?'Disqualified':teamDone?'Check-In Complete':s.n===2?'Jersey Pending':s.n===1?'Partial':'Waiting'}</span></div><div>${rows}</div>${!s.dq&&s.complete&&!teamDone?`<button class="cj-team-action" onclick="checkInTeamWithJerseys('${esc(t.code)}')">Check In Team + Give Jerseys</button>`:teamDone?`<div class="cj-team-action complete">✓ Team check-in and jersey release complete</div>`:''}</article>`}).join('')||'<div class="empty regops-checkin-empty"><b>No teams in this view</b><span>Try another check-in filter or clear the search and division filters.</span></div>'}
  function integratedBody(){const counts={all:0,ready:0,waiting:0,partial:0,attention:0,incomplete:0,disqualified:0};for(const t of integratedFilteredTeams(false)){const s=statusFor(t);counts.all++;counts[s.key]=(counts[s.key]||0)+1;if(s.dq||!s.complete||s.n<2)counts.attention++}const active=window.__regopsCheckinFilter||'all',chips=[['all','All',counts.all],['ready','Ready',counts.ready],['waiting','Not checked in',counts.waiting],['partial','Partial',counts.partial],['attention','Needs attention',counts.attention],['incomplete','Incomplete',counts.incomplete],['disqualified','Disqualified',counts.disqualified]];return`${overview()}<div class="regops-checkin-overview"><div class="regops-checkin-progress"><div><strong>Check-in + jersey release</strong><span>Use the combined action for each player or the entire team.</span></div><div class="regops-checkin-progress-meta"><b>${counts.ready}</b><span>teams ready</span><i aria-hidden="true">·</i><b>${counts.attention}</b><span>need attention</span></div><div class="regops-progress-track"><span style="width:${counts.all?Math.round(counts.ready/counts.all*100):0}%"></span></div></div><div class="regops-checkin-filters">${chips.map(([key,label,count])=>`<button type="button" class="regops-checkin-filter ${active===key?'active':''}" onclick="setRegopsCheckinFilter('${key}')"><span>${label}</span><b>${count}</b></button>`).join('')}</div></div><div class="regops-checkin-list cj-list">${cards()}</div>`}


  const priorSection=window.registrationOpsSection;
  window.registrationOpsSection=function(){
    if(window.__regopsTab==='jersey')window.__regopsTab='checkin';
    let html=priorSection();
    html=html.replace(/(<button class="regops-tab [^"]*" onclick="setRegopsTab\('checkin'\)">)Check-In(<\/button>)/g,'$1Check-In & Jersey$2');
    html=html.replace(/<button class="regops-tab [^"]*" onclick="setRegopsTab\('jersey'\)">Jersey<\/button>/g,'');
    if(window.__regopsTab!=='checkin')return html;
    const marker='<div class="regops-checkin-overview">',i=html.indexOf(marker);return i<0?html:html.slice(0,i)+integratedBody();
  };
  window.teamsSection=function(){return registrationOpsSection()};
  const priorSet=window.setRegopsTab;window.setRegopsTab=function(tab){return priorSet(tab==='jersey'?'checkin':tab)};
  if(window.__regopsTab==='jersey')window.__regopsTab='checkin';
  try{renderAll()}catch(e){console.error('Integrated check-in + jersey render failed',e)}
})();
</script>
